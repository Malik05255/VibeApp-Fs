name: H Lab Bootstrap

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/h-lab-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Malik05255/VibeApp-Fs
  SOURCE_BRANCH: main

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message || '', '[h-lab-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve bootstrap workflow
        run: |
          cp .github/workflows/h-lab-bootstrap.yml /tmp/h-lab-bootstrap.yml

      - name: Replace lab with current lm_AI snapshot
        run: |
          git remote add source "https://github.com/${SOURCE_REPO}.git" || true
          git fetch --depth=1 source "${SOURCE_BRANCH}"
          git checkout --orphan h-lab-root FETCH_HEAD
          mkdir -p .github/workflows
          cp /tmp/h-lab-bootstrap.yml .github/workflows/h-lab-bootstrap.yml

      - name: Give the lab an independent install identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.malik05255.lmai"', 'applicationId = "com.malik05255.lmai.hlab"')
          p.write_text(s)
          PY
          cat > H_LAB.md <<'EOF'
          # H Personal Assistant Lab

          This repository is an isolated experimental build of lm_AI for the personal assistant H.

          - Production/source repository: `Malik05255/VibeApp-Fs`
          - Lab applicationId: `com.malik05255.lmai.hlab`
          - Production applicationId remains unchanged.
          - The lab can be installed side-by-side with the production lm_AI app.
          - H is the single assistant identity across in-app chat, memory, reminders, location context and WhatsApp gateway.
          - WhatsApp credentials/tokens must never be committed to this repository or embedded in the APK.
          EOF

      - name: Commit isolated H lab baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: bootstrap H lab from current lm_AI [h-lab-sync]"
          git push --force origin HEAD:main
