name: H Portable V3 CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-app-sync/portable-page.ts"
      - "cloud/supabase/h-app-sync/portable-page_test.ts"
      - "cloud/supabase/h-app-sync/portable-v3-restore.ts"
      - "cloud/supabase/h-app-sync/portable-v3-restore_test.ts"
      - "cloud/supabase/h-portable-snapshot/**"
      - "cloud/supabase/h-portable-restore/**"
      - "cloud/supabase/h-backup-runner/**"
      - "cloud/supabase/migrations/20260912_h_portable_*_v3.sql"
      - "cloud/supabase/migrations/20260912_h_portable_v3_cleanup.sql"
      - "app/src/main/kotlin/com/malik/lmai/feature/assistant/HCloudLinkClient.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveViewModel.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveSettingsCard.kt"
      - ".github/workflows/h-portable-v3-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-app-sync/portable-page.ts"
      - "cloud/supabase/h-app-sync/portable-v3-restore.ts"
      - "cloud/supabase/h-portable-snapshot/**"
      - "cloud/supabase/h-portable-restore/**"
      - "cloud/supabase/h-backup-runner/**"
      - "cloud/supabase/migrations/20260912_h_portable_*_v3.sql"
      - "cloud/supabase/migrations/20260912_h_portable_v3_cleanup.sql"
      - "app/src/main/kotlin/com/malik/lmai/feature/assistant/HCloudLinkClient.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveViewModel.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveSettingsCard.kt"
      - ".github/workflows/h-portable-v3-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check portable v3 runtime
        run: |
          deno check \
            cloud/supabase/h-app-sync/portable-page.ts \
            cloud/supabase/h-app-sync/portable-v3-restore.ts \
            cloud/supabase/h-portable-snapshot/index.ts \
            cloud/supabase/h-portable-restore/index.ts \
            cloud/supabase/h-backup-runner/index.ts

      - name: Test portable v3 page and manifest integrity
        run: deno test cloud/supabase/h-app-sync/portable-page_test.ts

      - name: Test portable v3 staged restore validation
        run: deno test cloud/supabase/h-app-sync/portable-v3-restore_test.ts

      - name: Keep legacy portable v1/v2 compatible
        run: |
          deno test cloud/supabase/h-app-sync/portable-snapshot_test.ts
          deno test cloud/supabase/h-app-sync/portable-restore_test.ts

      - name: Assert immutable export-session contract
        shell: bash
        run: |
          set -euo pipefail
          sql=cloud/supabase/migrations/20260912_h_portable_export_v3.sql
          grep -Fq 'h_runtime_portable_export_sessions' "$sql"
          grep -Fq 'h_runtime_portable_export_pages' "$sql"
          grep -Fq 'all five portable sections are read by this single INSERT statement' "$sql"
          grep -Fq "interval '15 minutes'" "$sql"
          grep -Fq 'grant execute on function public.h_prepare_portable_export_v3' "$sql"
          grep -Fq "section in ('memories','tasks','reminders','contacts','learning')" "$sql"
          grep -Fq 'revoke all on table public.h_runtime_portable_export_sessions from public, anon, authenticated' "$sql"

      - name: Assert v3 restore remains atomic and merge-only
        shell: bash
        run: |
          set -euo pipefail
          sql=cloud/supabase/migrations/20260912_h_portable_restore_v3.sql
          grep -Fq 'h_restore_portable_snapshot_v3' "$sql"
          grep -Fq 'pg_advisory_xact_lock' "$sql"
          grep -Fq 'portable_v3_restore_pages_incomplete' "$sql"
          grep -Fq 'portable_v3_orphan_reminder_task' "$sql"
          grep -Fq 'schema_version in (1, 2, 3)' "$sql"
          grep -Fq "'mergeOnly',true" "$sql"
          grep -Fq "'deletedExistingState',false" "$sql"
          grep -Fq 'grant execute on function public.h_restore_portable_snapshot_v3' "$sql"
          if grep -Eq 'delete from public\.h_runtime_(memories|tasks|reminders|contacts|learning_state)' "$sql"; then
            echo 'Portable v3 restore must never delete existing H state.' >&2
            exit 1
          fi

      - name: Assert transient v3 staging is cleaned promptly
        shell: bash
        run: |
          set -euo pipefail
          cleanup=cloud/supabase/migrations/20260912_h_portable_v3_cleanup.sql
          snapshot=cloud/supabase/h-portable-snapshot/index.ts
          grep -Fq 'h_finish_portable_export_v3' "$cleanup"
          grep -Fq 'h_abort_portable_restore_v3' "$cleanup"
          grep -Fq 'h_cleanup_portable_restore_pages_v3' "$cleanup"
          grep -Fq "new.status = 'restored'" "$cleanup"
          grep -Fq 'mode === "finish_v3"' "$snapshot"
          grep -Fq 'h_finish_portable_export_v3' "$snapshot"

      - name: Assert Android automatically crosses the legacy 500-row boundary
        shell: bash
        run: |
          set -euo pipefail
          client=app/src/main/kotlin/com/malik/lmai/feature/assistant/HCloudLinkClient.kt
          vm=app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveViewModel.kt
          card=app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HMoveSettingsCard.kt
          grep -Fq 'beginPortableV3Export' "$client"
          grep -Fq 'portableV3Page' "$client"
          grep -Fq 'portableV3Manifest' "$client"
          grep -Fq 'beginPortableV3Restore' "$client"
          grep -Fq 'stagePortableV3RestorePage' "$client"
          grep -Fq 'restorePortableV3' "$client"
          grep -Fq 'portable_snapshot_requires_pagination' "$vm"
          grep -Fq 'h-portable-bundle' "$vm"
          grep -Fq 'RESTORE_H_PORTABLE_V3' "$client"
          grep -Fq '64L * 1024L * 1024L' "$card"
          grep -Fq 'openAssetFileDescriptor' "$card"

      - name: Assert large encrypted backups use v3 and stable identity secret
        shell: bash
        run: |
          set -euo pipefail
          backup=cloud/supabase/h-backup-runner/index.ts
          grep -Fq 'isPortableSnapshotLimitError' "$backup"
          grep -Fq 'h_prepare_portable_export_v3' "$backup"
          grep -Fq 'paged_core_v3' "$backup"
          grep -Fq 'verifyPortableV3Manifest' "$backup"
          grep -Fq 'MAX_BACKUP_PLAINTEXT_BYTES = 128 * 1024 * 1024' "$backup"
          grep -Fq 'portable_backup_payload_too_large' "$backup"
          grep -Fq 'loadIdentitySecret(db)' "$backup"
          grep -Fq 'loadOwnerRuntimeUserKey(db, identitySecret)' "$backup"
          if grep -Fq 'loadOwnerRuntimeUserKey(db, runtimeSecret)' "$backup"; then
            echo 'Durable owner identity must not be decrypted with poll_secret.' >&2
            exit 1
          fi
