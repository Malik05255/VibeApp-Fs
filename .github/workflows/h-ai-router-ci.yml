name: H AI Router CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-whatsapp-inbox/ai-router-policy.ts"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-policy_test.ts"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-runtime.ts"
      - "cloud/supabase/h-whatsapp-inbox/openrouter-ai.ts"
      - "cloud/supabase/migrations/20260909_h_ai_router_quota_manager.sql"
      - ".github/workflows/h-ai-router-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-whatsapp-inbox/ai-router-policy.ts"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-policy_test.ts"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-runtime.ts"
      - "cloud/supabase/h-whatsapp-inbox/openrouter-ai.ts"
      - "cloud/supabase/migrations/20260909_h_ai_router_quota_manager.sql"
      - ".github/workflows/h-ai-router-ci.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check H AI Router runtime
        run: deno check cloud/supabase/h-whatsapp-inbox/ai-router-policy.ts cloud/supabase/h-whatsapp-inbox/ai-router-runtime.ts cloud/supabase/h-whatsapp-inbox/openrouter-ai.ts

      - name: Test H AI Router policy
        run: deno test cloud/supabase/h-whatsapp-inbox/ai-router-policy_test.ts cloud/supabase/h-whatsapp-inbox/openrouter-ai_test.ts
