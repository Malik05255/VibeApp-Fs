name: H Memory Integrity Patch

on:
  push:
    branches: [codex/h-memory-integrity]
    paths:
      - ".github/scripts/h-apply-memory-integrity-patch.py"
      - ".github/workflows/h-memory-integrity-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/h-memory-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply guarded memory runtime patch
        run: python .github/scripts/h-apply-memory-integrity-patch.py
      - name: Assert only intended runtime changes exist
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'correctHMemory' cloud/supabase/h-app-sync/index.ts
          grep -Fq 'forgetHMemory' cloud/supabase/h-app-sync/index.ts
          grep -Fq 'memoryContext' cloud/supabase/h-whatsapp-inbox/index.ts
          grep -Fq 'hasExplicitMemorySaveIntent' cloud/supabase/h-whatsapp-inbox/index.ts
          ! grep -Fq '.from("h_runtime_memories").insert' cloud/supabase/h-whatsapp-inbox/index.ts
      - name: Commit patched runtime and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloud/supabase/h-app-sync/index.ts cloud/supabase/h-whatsapp-inbox/index.ts
          git rm .github/scripts/h-apply-memory-integrity-patch.py .github/workflows/h-memory-integrity-patch.yml
          git commit -m "feat(h): wire memory integrity across app and WhatsApp"
          git push origin HEAD:codex/h-memory-integrity
