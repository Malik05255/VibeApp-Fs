name: H Channel Message Bridge Patch

on:
  push:
    branches: [refactor/h-channel-message-bridge]
    paths:
      - ".h-channel-message-bridge-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: refactor/h-channel-message-bridge
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 tools/h_channel_message_bridge_patch.py

      - name: Commit runtime changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/supabase/h-whatsapp-inbox/index.ts cloud/whatsapp-worker/src/router.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "refactor(h): separate channel messages from voice transcripts"
          git push origin HEAD:refactor/h-channel-message-bridge
