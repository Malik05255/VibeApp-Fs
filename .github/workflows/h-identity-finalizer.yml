name: H identity finalizer

on:
  push:
    branches:
      - feat/h-final-identity-20260907

permissions:
  contents: write

jobs:
  patch-identity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/h-final-identity-20260907

      - name: Apply exact H identity patches
        shell: python
        run: |
          from pathlib import Path

          chat = Path('app/src/main/kotlin/com/malik/lmai/presentation/ui/chat/ChatScreen.kt')
          text = chat.read_text(encoding='utf-8')
          old = 'text = "\\u0645\\u062d\\u0645\\u062f"'
          new = 'text = "H"'
          if old not in text:
              raise SystemExit('Expected legacy chat identity label was not found')
          chat.write_text(text.replace(old, new, 1), encoding='utf-8')

          for relative in [
              'app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt',
              'app/src/main/kotlin/com/malik/lmai/feature/ai/FreeAiFailoverCoordinator.kt',
          ]:
              path = Path(relative)
              value = path.read_text(encoding='utf-8')
              path.write_text(value.replace('محمد', 'H'), encoding='utf-8')

          workflow = Path('.github/workflows/h-identity-finalizer.yml')
          workflow.unlink()

      - name: Commit finalized identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: finalize H identity in chat and runtime"
          git push origin HEAD:feat/h-final-identity-20260907
