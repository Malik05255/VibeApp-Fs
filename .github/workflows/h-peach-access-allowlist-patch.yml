name: H Peach Access Allowlist Patch

on:
  push:
    branches: [fix/h-peach-access-allowlist]
    paths:
      - ".h-peach-access-allowlist-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/h-peach-access-allowlist
          fetch-depth: 0

      - name: Apply deterministic patch
        run: python3 tools/h_peach_access_allowlist_patch.py

      - name: Commit runtime change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/supabase/h-whatsapp-inbox/index.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix(h): enforce Peach sender allowlist before persistence"
          git push origin HEAD:fix/h-peach-access-allowlist
