name: H Multi-Cloud CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-cloud-backup-config/**"
      - "cloud/supabase/migrations/20260910_h_multi_cloud_foundation.sql"
      - "cloud/supabase/migrations/20260910_h_backup_cloud_onboarding.sql"
      - ".github/workflows/h-multi-cloud-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-cloud-backup-config/**"
      - "cloud/supabase/migrations/20260910_h_multi_cloud_foundation.sql"
      - "cloud/supabase/migrations/20260910_h_backup_cloud_onboarding.sql"
      - ".github/workflows/h-multi-cloud-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check H multi-cloud runtime
        run: >-
          deno check
          cloud/supabase/h-cloud-manager/index.ts
          cloud/supabase/h-cloud-backup-config/index.ts

      - name: Assert multi-cloud fail-closed invariants
        shell: bash
        run: |
          set -euo pipefail
          migration=cloud/supabase/migrations/20260910_h_multi_cloud_foundation.sql
          manager=cloud/supabase/h-cloud-manager/index.ts
          backup=cloud/supabase/h-cloud-backup-config/index.ts
          grep -Fq "cloud_role in ('primary', 'backup')" "$migration"
          grep -Fq "h_runtime_cloud_one_enabled_primary" "$migration"
          grep -Fq "h_runtime_cloud_one_enabled_backup" "$migration"
          grep -Fq "auto_failover_eligible', false" "$migration"
          grep -Fq "backup?.metadata?.auto_failover_eligible === true" "$manager"
          grep -Fq "automaticFailoverReady: backupAutoFailoverEligible" "$manager"
          grep -Fq "standby_replication_ready === true" "$manager"
          grep -Fq "standby_runtime_ready === true" "$manager"
          grep -Fq "runtime_health_ok === true" "$manager"
          grep -Fq "replicationLagSeconds <= MAX_REPLICATION_LAG_SECONDS" "$manager"
          grep -Fq "probeFunctionDeployment" "$manager"
          grep -Fq "workerDeploymentState" "$manager"
          grep -Fq "Boolean(backup?.ready && backup?.last_health_ok === true && backup?.credential_id)" "$manager"
          grep -Fq "auto_failover_eligible: false" "$backup"
          grep -Fq "standby_runtime_ready: false" "$backup"

      - name: Assert primary health does not redefine standby preparedness
        shell: bash
        run: |
          set -euo pipefail
          manager=cloud/supabase/h-cloud-manager/index.ts
          if grep -Fq "automaticFailoverReady: primaryHealthy &&" "$manager"; then
            echo "Standby readiness must remain true when the primary becomes unhealthy." >&2
            exit 1
          fi
          grep -Fq "automaticFailoverReady: backupAutoFailoverEligible" "$manager"
