name: One-time root localization fix

on:
  push:
    branches:
      - fix/language-github-root-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/language-github-root-v2
          fetch-depth: 0

      - name: Apply patch script
        run: python3 .github/scripts/root_localization_fix.py

      - name: Remove one-time patch files
        run: |
          rm .github/scripts/root_localization_fix.py
          rm .github/workflows/one-time-root-localization-fix.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove remaining hard-coded Arabic and finalize GitHub UI"
          git push origin HEAD:fix/language-github-root-v2
