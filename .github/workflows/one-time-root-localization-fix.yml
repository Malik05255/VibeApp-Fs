name: One-time root localization fix

on:
  push:
    branches: [ fix/language-github-root-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/language-github-root-v2
          fetch-depth: 0

      - name: Apply deterministic localization and GitHub UI patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          def save(p, text):
              p.write_text(text, encoding='utf-8')

          # Agent session completion messages.
          p, s = load('app/src/main/kotlin/com/vibe/app/feature/agent/service/AgentSessionManager.kt')
          s = replace_once(s, 'import android.util.Log\n', 'import android.util.Log\nimport com.vibe.app.R\nimport com.vibe.app.data.preferences.AppText\n', 'AgentSession imports')
          s = replace_once(s, '"تم تنفيذ المهمة."', 'AppText.get(R.string.agent_task_executed)', 'Agent task done')
          s = replace_once(s, '"اكتملت جلسة الوكيل."', 'AppText.get(R.string.agent_session_completed)', 'Agent session done')
          save(p, s)

          # Language selection route: no Arabic UI literals in Kotlin.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/common/NavigationGraph.kt')
          s = replace_once(s, 'import androidx.compose.ui.platform.LocalLayoutDirection\n', 'import androidx.compose.ui.platform.LocalLayoutDirection\nimport androidx.compose.ui.res.stringResource\n', 'Navigation stringResource import')
          s = replace_once(s, 'import com.vibe.app.presentation.ui.auth.AuthViewModel\n', 'import com.vibe.app.R\nimport com.vibe.app.presentation.ui.auth.AuthViewModel\n', 'Navigation R import')
          s = replace_once(s, 'text = if (selectedLanguage == "ar") "اللغة" else "Language",', 'text = stringResource(R.string.language),', 'Language title')
          s = replace_once(s, 'text = if (selectedLanguage == "ar") "اختر لغة التطبيق" else "Choose your app language",', 'text = stringResource(R.string.choose_app_language),', 'Language subtitle')
          s = replace_once(s, 'Text(if (selectedLanguage == "ar") "تأكيد" else "Confirm")', 'Text(stringResource(R.string.confirm))', 'Language confirm')
          save(p, s)

          # Forced update screen.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/update/ForcedUpdateScreen.kt')
          s = replace_once(s, 'import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.res.stringResource\n', 'Update stringResource import')
          s = replace_once(s, 'import com.vibe.app.feature.update.UpdateState\n', 'import com.vibe.app.R\nimport com.vibe.app.feature.update.UpdateState\n', 'Update R import')
          s = replace_once(s, 'text = "يتوفر تحديث جديد",', 'text = stringResource(R.string.update_available_title),', 'Update title')
          s = replace_once(s, 'text = "يلزم تحديث lm_AI للمتابعة.",', 'text = stringResource(R.string.update_required_body),', 'Update body')
          s = replace_once(s, 'Text("تحديث الآن")', 'Text(stringResource(R.string.update_now))', 'Update now')
          s = replace_once(s, 'Text("إعادة المحاولة")', 'Text(stringResource(R.string.retry))', 'Update retry')
          save(p, s)

          # Chat restore-history label.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/chat/ChatScreen.kt')
          s = replace_once(s, 'text = "استرجع التعديلات السابقة",', 'text = stringResource(R.string.chat_restore_previous_changes),', 'Chat restore label')
          save(p, s)

          # Welcome screen uses resources for both UI and callback errors.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/auth/WelcomeSignInScreen.kt')
          s = replace_once(s, 'import androidx.compose.ui.platform.LocalContext\n', 'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.res.stringResource\n', 'Welcome stringResource import')
          s = replace_once(s, 'import com.vibe.app.BuildConfig\n', 'import com.vibe.app.BuildConfig\nimport com.vibe.app.R\nimport com.vibe.app.data.preferences.AppText\n', 'Welcome app imports')
          replacements = [
              ('errorMessage = if (isArabic) "لم يُرجع حساب Google بريدًا إلكترونيًا." else "Google did not return an email address."', 'errorMessage = AppText.get(R.string.google_no_email)', 'Google email'),
              ('errorMessage = if (isArabic) "لم يُرجع Google رمز تسجيل صالحًا. أعد المحاولة." else "Google did not return a valid ID token. Try again."', 'errorMessage = AppText.get(R.string.google_no_id_token)', 'Google token'),
              ('errorMessage = if (isArabic) "تعذر تسجيل الدخول بحساب Google. تفاصيل الخطأ: $detail" else "Google sign-in failed. Error: $detail"', 'errorMessage = AppText.get(R.string.google_sign_in_failed_detail, detail)', 'Google detail'),
              ('errorMessage = if (isArabic) "تعذر فتح تسجيل الدخول." else "Unable to open sign-in."', 'errorMessage = AppText.get(R.string.google_unable_open_signin)', 'Google open'),
              ('errorMessage = if (isArabic) "معرّف Google Web Client غير مضبوط لهذه النسخة." else "Google Web Client ID is not configured for this build."', 'errorMessage = AppText.get(R.string.google_web_client_missing)', 'Google client'),
              ('if (isArabic) "اربط حساب Google أو تابع محليًا" else "Connect Google or continue locally",', 'stringResource(R.string.welcome_google_or_local),', 'Welcome subtitle'),
              ('else Text(if (isArabic) "المتابعة باستخدام Google" else "Continue with Google", fontWeight = FontWeight.SemiBold)', 'else Text(stringResource(R.string.continue_with_google), fontWeight = FontWeight.SemiBold)', 'Welcome Google button'),
              ('Text(if (isArabic) "المتابعة بدون تسجيل" else "Continue without signing in", fontWeight = FontWeight.SemiBold)', 'Text(stringResource(R.string.continue_without_signing_in), fontWeight = FontWeight.SemiBold)', 'Welcome local button'),
              ('googleSignInErrorMessage(error.statusCode, isArabic)', 'googleSignInErrorMessage(error.statusCode)', 'Google error call'),
          ]
          for old, new, label in replacements:
              s = replace_once(s, old, new, label)
          old_fn = '''private fun googleSignInErrorMessage(statusCode: Int, isArabic: Boolean): String =
    if (statusCode == 10) {
        if (isArabic) "إعداد Google لهذه النسخة غير مكتمل (رمز 10). تحقق من package name وSHA-1 وWeb client ID."
        else "Google is not configured for this build (code 10). Check package name, SHA-1 and Web client ID."
    } else {
        if (isArabic) "لم يكتمل تسجيل الدخول بحساب Google (رمز $statusCode). حاول مرة أخرى أو تابع محليًا."
        else "Google sign-in did not complete (code $statusCode). Try again or continue locally."
    }
'''
          new_fn = '''private fun googleSignInErrorMessage(statusCode: Int): String =
    if (statusCode == 10) {
        AppText.get(R.string.google_config_code_10)
    } else {
        AppText.get(R.string.google_signin_status_error, statusCode)
    }
'''
          s = replace_once(s, old_fn, new_fn, 'Google error function')
          save(p, s)

          # Comment-only quoted Arabic word that should not trip the audit.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/setting/LanguageViewModel.kt')
          s = s.replace('إذا كان الاستدعاء من زر "تأكيد"، يفضل استخدام', 'إذا كان الاستدعاء من زر التأكيد، يفضل استخدام')
          save(p, s)

          # GitHub connection: no visible code/copy UI, start-aligned mark and independently centered label.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/github/GitHubSettingsScreen.kt')
          s = s.replace('import androidx.compose.material.icons.outlined.ContentCopy\n', '')
          start = s.index('                if (state.deviceUserCode != null) {')
          end_marker = '            } else {\n                Spacer(Modifier.height(12.dp))'
          end = s.index(end_marker, start)
          replacement = '''                if (state.deviceUserCode != null) {
                    Surface(
                        modifier = Modifier.fillMaxWidth(),
                        shape = RoundedCornerShape(18.dp),
                        color = MaterialTheme.colorScheme.surfaceVariant,
                    ) {
                        Column(
                            modifier = Modifier.padding(horizontal = 18.dp, vertical = 14.dp),
                            verticalArrangement = Arrangement.spacedBy(8.dp),
                        ) {
                            Row(
                                verticalAlignment = Alignment.CenterVertically,
                                horizontalArrangement = Arrangement.spacedBy(10.dp),
                            ) {
                                CircularProgressIndicator(modifier = Modifier.size(22.dp), strokeWidth = 2.dp)
                                Column(modifier = Modifier.weight(1f)) {
                                    Text(
                                        stringResource(R.string.github_settings_browser_opened),
                                        fontWeight = FontWeight.SemiBold,
                                    )
                                    Text(
                                        stringResource(R.string.github_settings_waiting),
                                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                                        style = MaterialTheme.typography.bodySmall,
                                    )
                                }
                            }
                            Text(
                                stringResource(R.string.github_settings_code_copied_hint),
                                color = MaterialTheme.colorScheme.onSurfaceVariant,
                                style = MaterialTheme.typography.bodySmall,
                            )
                            TextButton(
                                modifier = Modifier.align(Alignment.End),
                                onClick = {
                                    state.verificationUri?.let { uri ->
                                        context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(uri)))
                                    }
                                },
                            ) {
                                Icon(Icons.Outlined.OpenInBrowser, null, Modifier.size(18.dp))
                                Spacer(Modifier.size(6.dp))
                                Text(stringResource(R.string.github_settings_open_again))
                            }
                        }
                    }
                }
'''
          s = s[:start] + replacement + s[end:]

          fn_start = s.index('@Composable\nprivate fun GitHubConnectButton(')
          fn_end = s.index('private fun copyGitHubCode', fn_start)
          new_button = '''@Composable
private fun GitHubConnectButton(
    enabled: Boolean,
    loading: Boolean,
    onClick: () -> Unit,
) {
    Surface(
        shape = RoundedCornerShape(24.dp),
        color = Color(0xFF111214),
        modifier = Modifier
            .fillMaxWidth()
            .height(82.dp)
            .clickable(enabled = enabled, onClick = onClick),
    ) {
        Box(
            modifier = Modifier
                .fillMaxWidth()
                .padding(horizontal = 18.dp, vertical = 14.dp),
        ) {
            Surface(
                shape = CircleShape,
                color = Color.White,
                modifier = Modifier
                    .align(Alignment.CenterStart)
                    .size(52.dp),
            ) {
                Box(contentAlignment = Alignment.Center) {
                    if (loading) {
                        CircularProgressIndicator(
                            modifier = Modifier.size(24.dp),
                            strokeWidth = 2.dp,
                            color = Color(0xFF111214),
                        )
                    } else {
                        Icon(
                            painter = painterResource(R.drawable.ic_github_mark),
                            contentDescription = null,
                            tint = Color(0xFF111214),
                            modifier = Modifier.size(30.dp),
                        )
                    }
                }
            }

            Text(
                text = stringResource(R.string.github_settings_connect),
                color = Color.White,
                style = MaterialTheme.typography.titleLarge,
                fontWeight = FontWeight.Bold,
                textAlign = TextAlign.Center,
                modifier = Modifier.align(Alignment.Center),
            )
        }
    }
}

'''
          s = s[:fn_start] + new_button + s[fn_end:]
          save(p, s)

          # MainActivity re-applies the persisted locale before Compose content.
          p, s = load('app/src/main/kotlin/com/vibe/app/presentation/ui/main/MainActivity.kt')
          s = replace_once(
              s,
              '        super.onCreate(savedInstanceState)\n\n        runCatching { enableEdgeToEdge() }',
              '        super.onCreate(savedInstanceState)\n\n        runCatching { languageManager.applyStoredLanguage() }\n        runCatching { enableEdgeToEdge() }',
              'MainActivity locale apply',
          )
          save(p, s)

          # Make this build unambiguously newer than the previously installed 2.0.1 APK.
          p, s = load('app/build.gradle.kts')
          s = replace_once(s, 'versionCode = 20001', 'versionCode = 20002', 'versionCode')
          s = replace_once(s, 'versionName = "2.0.1"', 'versionName = "2.0.2"', 'versionName')
          save(p, s)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-root-localization-fix.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove remaining hard-coded Arabic and finalize GitHub UI"
          git push origin HEAD:fix/language-github-root-v2
