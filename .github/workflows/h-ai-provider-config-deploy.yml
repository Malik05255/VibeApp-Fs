name: Deploy H AI Provider Config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-ai-provider-config/**"
      - "cloud/supabase/h-whatsapp-inbox/owner-paid-policy.ts"
      - "cloud/supabase/migrations/20260909_h_owner_paid_ai_runtime.sql"
      - ".github/workflows/h-ai-provider-config-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-ai-provider-config-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Supabase deployment configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "H AI provider config deployment is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy h-ai-provider-config
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy h-ai-provider-config --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Verify deployed inventory
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          grep -Fq 'h-ai-provider-config' <<< "$inventory"

      - name: Probe public health endpoint
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-ai-provider-config/health")"
          grep -Fq '"paidByDefault":false' <<< "$body"
          grep -Fq '"paidRetries":0' <<< "$body"
          grep -Fq '"freeFallbackDefault":false' <<< "$body"

      - name: Probe admin authorization boundary
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-ai-provider-config/status")"
          if [ "$status" != "401" ]; then
            echo "Expected HTTP 401 without x-h-runtime-secret, got $status" >&2
            cat "$response_file" >&2
            exit 1
          fi
          grep -Fq 'Unauthorized' "$response_file"
