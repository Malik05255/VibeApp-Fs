name: H Production Readiness CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-app-sync/owner-continuity*"
      - "cloud/supabase/h-learning-cycle/**"
      - "cloud/supabase/h-knowledge-verifier/**"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-*"
      - "cloud/supabase/h-whatsapp-inbox/voice-bridge*"
      - "cloud/whatsapp-worker/src/**"
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-cloud-backup-config/**"
      - "cloud/supabase/h-backup-runner/**"
      - "cloud/standby/**"
      - "cloud/live-readiness/**"
      - "docs/H_PRODUCTION_READINESS.md"
      - "docs/H_LIVE_READINESS_LEDGER.md"
      - ".github/scripts/h-production-readiness-check.sh"
      - ".github/workflows/h-live-readiness-ledger.yml"
      - ".github/workflows/h-production-readiness-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-app-sync/owner-continuity*"
      - "cloud/supabase/h-learning-cycle/**"
      - "cloud/supabase/h-knowledge-verifier/**"
      - "cloud/supabase/h-whatsapp-inbox/ai-router-*"
      - "cloud/supabase/h-whatsapp-inbox/voice-bridge*"
      - "cloud/whatsapp-worker/src/**"
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-cloud-backup-config/**"
      - "cloud/supabase/h-backup-runner/**"
      - "cloud/standby/**"
      - "cloud/live-readiness/**"
      - "docs/H_PRODUCTION_READINESS.md"
      - "docs/H_LIVE_READINESS_LEDGER.md"
      - ".github/scripts/h-production-readiness-check.sh"
      - ".github/workflows/h-live-readiness-ledger.yml"
      - ".github/workflows/h-production-readiness-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ten-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run reusable H production readiness gates
        shell: bash
        run: bash .github/scripts/h-production-readiness-check.sh
