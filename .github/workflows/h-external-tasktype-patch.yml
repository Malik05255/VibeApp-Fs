name: H Scheduler Consistency Patch

on:
  push:
    branches: [feat/h-unified-owner-messaging]
    paths:
      - ".h-external-tasktype-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/h-unified-owner-messaging
          fetch-depth: 0
      - run: python3 tools/h_fix_external_task_type.py
      - run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/supabase/h-whatsapp-inbox/index.ts
          git diff --cached --check
          git commit -m "fix(h): keep external schedule cancellation consistent"
          git push origin HEAD:feat/h-unified-owner-messaging
