name: H Stable Identity Secret CI

on:
  pull_request:
    paths:
      - "cloud/supabase/_shared/h-identity-secret.ts"
      - "cloud/supabase/h-ai-provider-app/**"
      - "cloud/supabase/h-app-media/**"
      - "cloud/supabase/h-app-sync/**"
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-owner-config/**"
      - "cloud/supabase/h-portable-restore/**"
      - "cloud/supabase/h-portable-snapshot/**"
      - "cloud/supabase/h-reminder-sync/**"
      - "cloud/supabase/h-standby-runtime-app/**"
      - "cloud/supabase/h-whatsapp-inbox/**"
      - "cloud/supabase/migrations/20260910_h_stable_identity_secret.sql"
      - ".github/workflows/h-stable-identity-secret-ci.yml"
  push:
    branches: [ "main" ]
    paths:
      - "cloud/supabase/_shared/h-identity-secret.ts"
      - "cloud/supabase/h-ai-provider-app/**"
      - "cloud/supabase/h-app-media/**"
      - "cloud/supabase/h-app-sync/**"
      - "cloud/supabase/h-cloud-manager/**"
      - "cloud/supabase/h-owner-config/**"
      - "cloud/supabase/h-portable-restore/**"
      - "cloud/supabase/h-portable-snapshot/**"
      - "cloud/supabase/h-reminder-sync/**"
      - "cloud/supabase/h-standby-runtime-app/**"
      - "cloud/supabase/h-whatsapp-inbox/**"
      - "cloud/supabase/migrations/20260910_h_stable_identity_secret.sql"
      - ".github/workflows/h-stable-identity-secret-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check identity consumers
        shell: bash
        run: |
          set -euo pipefail
          deno check \
            cloud/supabase/_shared/h-identity-secret.ts \
            cloud/supabase/h-ai-provider-app/index.ts \
            cloud/supabase/h-app-media/index.ts \
            cloud/supabase/h-app-sync/index.ts \
            cloud/supabase/h-cloud-manager/index.ts \
            cloud/supabase/h-owner-config/index.ts \
            cloud/supabase/h-portable-restore/index.ts \
            cloud/supabase/h-portable-snapshot/index.ts \
            cloud/supabase/h-reminder-sync/index.ts \
            cloud/supabase/h-standby-runtime-app/index.ts \
            cloud/supabase/h-whatsapp-inbox/index.ts

      - name: Assert stable identity config bootstrap
        shell: bash
        run: |
          set -euo pipefail
          migration=cloud/supabase/migrations/20260910_h_stable_identity_secret.sql
          helper=cloud/supabase/_shared/h-identity-secret.ts
          grep -Fq "select 'identity_secret', secret_value" "$migration"
          grep -Fq "where key = 'poll_secret'" "$migration"
          grep -Fq "on conflict (key) do nothing" "$migration"
          grep -Fq 'H_IDENTITY_SECRET_CONFIG_KEY = "identity_secret"' "$helper"
          if grep -Fq 'eq("key", "poll_secret")' "$helper"; then
            echo "identity-secret helper must never fall back to poll_secret" >&2
            exit 1
          fi

      - name: Assert Google durable identity never uses poll secret
        shell: bash
        run: |
          set -euo pipefail
          files=(
            cloud/supabase/h-ai-provider-app/index.ts
            cloud/supabase/h-app-media/index.ts
            cloud/supabase/h-app-sync/index.ts
            cloud/supabase/h-cloud-manager/index.ts
            cloud/supabase/h-portable-restore/index.ts
            cloud/supabase/h-portable-snapshot/index.ts
            cloud/supabase/h-reminder-sync/index.ts
            cloud/supabase/h-standby-runtime-app/index.ts
          )
          for file in "${files[@]}"; do
            grep -Fq 'loadIdentitySecret' "$file"
            if grep -Eq 'secretFingerprint\([^,]*(runtimeSecret|pollSecret)[^,]*,[[:space:]]*GOOGLE_SUB_LABEL' "$file"; then
              echo "Google durable identity is still keyed by runtime poll secret in $file" >&2
              exit 1
            fi
          done

      - name: Assert WhatsApp durable identity uses identity secret
        shell: bash
        run: |
          set -euo pipefail
          owner=cloud/supabase/h-whatsapp-inbox/owner-identity.ts
          owner_pairing=cloud/supabase/h-whatsapp-inbox/owner-pairing.ts
          friend_pairing=cloud/supabase/h-whatsapp-inbox/friend-pairing.ts
          owner_config=cloud/supabase/h-owner-config/index.ts

          grep -Fq 'loadIdentitySecret' "$owner"
          grep -Fq 'loadIdentitySecret' "$owner_pairing"
          grep -Fq 'loadIdentitySecret' "$friend_pairing"
          grep -Fq 'loadIdentitySecret' "$owner_config"

          if grep -Eq 'ownerFingerprint\([^,]+,[[:space:]]*(runtimeSecret|pollSecret)' "$owner_pairing" "$owner_config"; then
            echo "Owner fingerprint must use identity_secret" >&2
            exit 1
          fi
          if grep -Eq 'friendFingerprint\([^,]+,[[:space:]]*(runtimeSecret|pollSecret)' "$friend_pairing" "$owner_config"; then
            echo "Friend fingerprint must use identity_secret" >&2
            exit 1
          fi
          if grep -Eq 'encryptRuntimeUserKey\([^,]+,[[:space:]]*(runtimeSecret|pollSecret)' "$owner_pairing"; then
            echo "Durable runtime user key encryption must use identity_secret" >&2
            exit 1
          fi

      - name: Assert poll secret remains runtime authentication material
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.eq("key", "poll_secret")' cloud/supabase/h-owner-config/index.ts
          grep -Fq 'pairingCodeFingerprint(challenge.code, runtimeSecret)' cloud/supabase/h-app-sync/index.ts
          grep -Fq 'pairingCodeFingerprint(code, runtimeSecret)' cloud/supabase/h-app-sync/index.ts
