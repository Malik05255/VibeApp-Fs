name: H Move Continuity CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-app-sync/owner-continuity.ts"
      - "cloud/supabase/h-app-sync/owner-continuity_test.ts"
      - "cloud/supabase/h-owner-continuity/**"
      - "app/src/main/kotlin/com/malik/lmai/feature/assistant/HOwnerContinuityClient.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/AuthViewModel.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleAccountSession.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleIdTokenProvider.kt"
      - "app/src/test/kotlin/com/malik/lmai/presentation/ui/auth/GoogleIdTokenProviderTest.kt"
      - ".github/workflows/h-owner-continuity-deploy.yml"
      - ".github/workflows/h-move-h-continuity-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-app-sync/owner-continuity.ts"
      - "cloud/supabase/h-app-sync/owner-continuity_test.ts"
      - "cloud/supabase/h-owner-continuity/**"
      - "app/src/main/kotlin/com/malik/lmai/feature/assistant/HOwnerContinuityClient.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/AuthViewModel.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleAccountSession.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleIdTokenProvider.kt"
      - "app/src/test/kotlin/com/malik/lmai/presentation/ui/auth/GoogleIdTokenProviderTest.kt"
      - ".github/workflows/h-owner-continuity-deploy.yml"
      - ".github/workflows/h-move-h-continuity-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test opaque continuity handle
        run: deno test cloud/supabase/h-app-sync/owner-continuity_test.ts

      - name: Type-check continuity endpoint
        run: deno check cloud/supabase/h-owner-continuity/index.ts

      - name: Assert Move H privacy contract
        shell: bash
        run: |
          set -euo pipefail
          endpoint=cloud/supabase/h-owner-continuity/index.ts
          helper=cloud/supabase/h-app-sync/owner-continuity.ts
          client=app/src/main/kotlin/com/malik/lmai/feature/assistant/HOwnerContinuityClient.kt

          grep -Fq 'OWNER_CONTINUITY_LABEL = "h-owner-continuity-v1"' "$helper"
          grep -Fq 'return `h1_${digest}`' "$helper"
          grep -Fq 'rawRuntimeUserKeyReturned: false' "$endpoint"
          grep -Fq 'rawWhatsAppOwnerReturned: false' "$endpoint"
          grep -Fq 'rawGoogleSubjectReturned: false' "$endpoint"
          grep -Fq 'providerCredentialsReturned: false' "$endpoint"
          grep -Fq 'rawMediaReturned: false' "$endpoint"
          grep -Fq 'resumeExistingH: true' "$endpoint"
          grep -Fq 'sameRuntimeAsWhatsApp: true' "$endpoint"
          grep -Fq 'Regex("^h1_[0-9a-f]{64}$")' "$client"
          grep -Fq 'invalid_linked_continuity_contract' "$client"

      - name: Assert continuity endpoint is read-only
        shell: bash
        run: |
          set -euo pipefail
          endpoint=cloud/supabase/h-owner-continuity/index.ts
          if grep -Eiq '\.(insert|update|upsert|delete)\(' "$endpoint"; then
            echo "Move H continuity status must remain read-only." >&2
            exit 1
          fi
          grep -Fq '.select("google_audience,runtime_user_key_ciphertext")' "$endpoint"

      - name: Assert Android resumes the same H owner scope
        shell: bash
        run: |
          set -euo pipefail
          session=app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleAccountSession.kt
          auth=app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/AuthViewModel.kt

          grep -Fq 'KEY_H_CONTINUITY_HANDLE = "h_continuity_handle"' "$session"
          grep -Fq 'return "h-continuity:$continuityHandle"' "$session"
          grep -Fq 'saveHContinuityHandle' "$session"
          grep -Fq 'clearHContinuityHandle' "$session"
          grep -Fq 'GoogleAccountSession.save(context, account)' "$auth"
          grep -Fq 'hOwnerContinuityClient.status()' "$auth"
          grep -Fq 'continuity.resumeExistingH' "$auth"
          grep -Fq 'GoogleAccountSession.saveHContinuityHandle' "$auth"
          grep -Fq 'GoogleAccountSession.clearHContinuityHandle' "$auth"

          # Fresh-install/new-device recovery must start from the authenticated Google owner,
          # not from a pre-existing local H handle. The account is saved before cloud
          # continuity resolution so GoogleIdTokenProvider can authorize the lookup.
          save_line="$(grep -nF 'GoogleAccountSession.save(context, account)' "$auth" | head -1 | cut -d: -f1)"
          continuity_line="$(grep -nF 'hOwnerContinuityClient.status()' "$auth" | head -1 | cut -d: -f1)"
          test -n "$save_line"
          test -n "$continuity_line"
          test "$save_line" -lt "$continuity_line"

      - name: Assert H owner token refresh is identity-only
        shell: bash
        run: |
          set -euo pipefail
          provider=app/src/main/kotlin/com/malik/lmai/presentation/ui/auth/GoogleIdTokenProvider.kt

          grep -Fq '.requestEmail()' "$provider"
          grep -Fq '.requestProfile()' "$provider"
          grep -Fq '.requestIdToken(clientId)' "$provider"
          grep -Fq 'H owner continuity is an identity operation, not a Google Drive operation.' "$provider"

          if grep -Fq 'drive.file' "$provider" || grep -Fq 'DRIVE_FILE_SCOPE' "$provider" || grep -Fq '.requestScopes(' "$provider"; then
            echo "Recovering H must not depend on Google Drive authorization." >&2
            exit 1
          fi

      - name: Assert production deployment path exists
        shell: bash
        run: |
          set -euo pipefail
          deploy=.github/workflows/h-owner-continuity-deploy.yml
          grep -Fq 'supabase functions deploy h-owner-continuity' "$deploy"
          grep -Fq 'supabase functions list' "$deploy"
          grep -Fq 'functions/v1/h-owner-continuity' "$deploy"
          grep -Fq 'Production function deployed: **true**' "$deploy"
          grep -Fq 'Production function deployed: **false**' "$deploy"
