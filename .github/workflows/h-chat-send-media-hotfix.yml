name: H chat send/media hotfix

on:
  push:
    branches:
      - fix/h-chat-send-media
    paths:
      - .github/workflows/h-chat-send-media-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/h-chat-send-media
          fetch-depth: 0

      - name: Apply source hotfix
        run: python3 .github/scripts/h-chat-send-media-hotfix.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'freeAiBootstrapper.ensureReady()' app/src/main/kotlin/com/malik/lmai/presentation/ui/chat/ChatViewModel.kt
          grep -q 'ActivityResultContracts.OpenDocument()' app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HChatComposer.kt
          grep -q 'HAppMediaPreprocessor' app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt

      - name: Commit source hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/malik/lmai/presentation/ui/chat/ChatViewModel.kt \
                  app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HChatComposer.kt \
                  app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HChatRefinedScreen.kt \
                  app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt
          git diff --cached --check
          git commit -m "fix(h): restore send and media attachments"
          git push origin HEAD:fix/h-chat-send-media
