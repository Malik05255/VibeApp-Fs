name: H Standby Promotion Controls CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-standby-failover-controller/**"
      - "cloud/supabase/h-standby-fencing-config/**"
      - "cloud/supabase/h-standby-promote/**"
      - "cloud/supabase/h-standby-runtime-config/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/20260910_h_standby_execution_contract.sql"
      - ".github/workflows/h-standby-promotion-controls-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-failover-controller/**"
      - "cloud/supabase/h-standby-fencing-config/**"
      - "cloud/supabase/h-standby-promote/**"
      - "cloud/supabase/h-standby-runtime-config/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/20260910_h_standby_execution_contract.sql"
      - ".github/workflows/h-standby-promotion-controls-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check promotion and fencing control plane
        run: >-
          deno check
          cloud/supabase/h-standby-promote/index.ts
          cloud/supabase/h-standby-promote/fence-assertion.ts
          cloud/supabase/h-standby-fencing-config/index.ts
          cloud/supabase/h-standby-failover-controller/index.ts
          cloud/standby/supabase/h-standby-health/index.ts

      - name: Test signed fencing and standby health states
        run: >-
          deno test
          cloud/supabase/h-standby-promote/fence-assertion_test.ts
          cloud/standby/supabase/h-standby-health/standby-health-policy_test.ts

      - name: Assert promotion requires signed independent fencing
        shell: bash
        run: |
          set -euo pipefail
          promoter=cloud/supabase/h-standby-promote/index.ts
          verifier=cloud/supabase/h-standby-promote/fence-assertion.ts
          grep -Fq 'mode || "") !== "fenced_request_only"' "$promoter"
          grep -Fq 'verifyFenceAssertion' "$promoter"
          grep -Fq 'fence_assertion_required' "$promoter"
          grep -Fq 'primaryWriteFenced: true' "$promoter"
          grep -Fq 'automaticSelfPromotionEnabled: false' "$promoter"
          grep -Fq 'fence.fenceEpoch <= priorEpoch' "$promoter"
          grep -Fq 'last_fence_epoch: priorEpoch' "$promoter"
          grep -Fq 'header?.alg !== "ES256"' "$verifier"
          grep -Fq 'header?.typ !== "h-fence+jwt"' "$verifier"
          grep -Fq 'claims?.primary_write_fenced !== true' "$verifier"
          grep -Fq 'fencing_private_key_forbidden' "$verifier"
          grep -Fq 'url.protocol !== "https:"' "$verifier"

      - name: Assert fencing config stores only a public authority key
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-fencing-config/index.ts
          inventory=cloud/supabase/h-standby-runtime-config/function-inventory.ts
          grep -Fq 'parseVerificationJwk' "$config"
          grep -Fq 'fencing_public_jwk' "$config"
          grep -Fq 'fencing_primary_project_ref' "$config"
          grep -Fq 'fencing_standby_project_ref' "$config"
          grep -Fq 'standby_fencing_private_key_stored: false' "$config"
          grep -Fq 'automatic_self_promotion_enabled: false' "$config"
          grep -Fq 'standby_fencing_reconfiguration_forbidden_after_promotion' "$config"
          grep -Fq '"h-standby-fencing-config"' "$inventory"
          if grep -Fq '"h-standby-fencing-config"' "$inventory" | grep -q '^$'; then true; fi
          if grep -Eq 'private_jwk|private_key|signing_key' "$config"; then
            echo "Fencing config must not accept or store private signing material." >&2
            exit 1
          fi

      - name: Assert health fails closed without fencing and verifies active attestation
        shell: bash
        run: |
          set -euo pipefail
          health=cloud/standby/supabase/h-standby-health/standby-health-policy.ts
          index=cloud/standby/supabase/h-standby-health/index.ts
          grep -Fq 'STANDBY_FENCING_CONTRACT = "h_standby_fencing_v1"' "$health"
          grep -Fq 'passiveExecutionContractReady &&' "$health"
          grep -Fq 'fencingAuthorityReady &&' "$health"
          grep -Fq 'promotionAttested &&' "$health"
          grep -Fq 'fencingAttested &&' "$health"
          grep -Fq '!automaticSelfPromotionEnabled' "$health"
          grep -Fq 'validHttpsIssuer' "$health"
          grep -Fq 'loadState(db, "standby_fencing")' "$index"
          grep -Fq 'loadFencingConfig(db)' "$index"

      - name: Assert controller cannot bypass standby fencing verifier
        shell: bash
        run: |
          set -euo pipefail
          controller=cloud/supabase/h-standby-failover-controller/index.ts
          grep -Fq 'h_runtime_evaluate_cloud_failover_gate' "$controller"
          grep -Fq 'gate?.decision !== "failover_eligible"' "$controller"
          grep -Fq 'mode || "") !== "fenced_request_only"' "$controller"
          grep -Fq 'fence_assertion' "$controller"
          grep -Fq 'before?.fencingAuthorityReady !== true' "$controller"
          grep -Fq 'promoteWithExternalFence' "$controller"
          grep -Fq 'after?.fencingAttested !== true' "$controller"
          grep -Fq 'after?.primaryWriteFenced !== true' "$controller"
          grep -Fq 'automaticTrafficSwitchPerformed: false' "$controller"
          grep -Fq 'automaticSelfPromotionEnabled: false' "$controller"
          grep -Fq 'auto_failover_eligible: false' "$controller"
          if grep -Fq 'db.rpc("h_promote_standby_request_only_v1"' "$controller"; then
            echo "Primary controller must not bypass the standby fencing verifier." >&2
            exit 1
          fi

      - name: Assert no autonomous execution or outbound credential exposure
        shell: bash
        run: |
          set -euo pipefail
          controller=cloud/supabase/h-standby-failover-controller/index.ts
          promoter=cloud/supabase/h-standby-promote/index.ts
          fencing=cloud/supabase/h-standby-fencing-config/index.ts
          if grep -Eq 'cron[.]schedule|net[.]http|WHATSAPP_ACCESS_TOKEN|META_ACCESS_TOKEN' "$controller" "$promoter" "$fencing"; then
            echo "Fencing/promotion plane must not activate scheduler or outbound credentials." >&2
            exit 1
          fi
          if grep -Eq 'console[.](log|info).*serviceRole|console[.](log|info).*runtimeSecret' "$controller" "$promoter" "$fencing"; then
            echo "Fencing/promotion plane must not log credential material." >&2
            exit 1
          fi

      - name: Assert fencing-capable immutable standby bundle
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          ref="$(sed -nE 's/^const STANDBY_BUNDLE_REF = "([0-9a-f]{40})";$/\1/p' "$config")"
          test -n "$ref"
          git cat-file -e "$ref:cloud/supabase/h-standby-promote/index.ts"
          git cat-file -e "$ref:cloud/supabase/h-standby-promote/fence-assertion.ts"
          git show "$ref:cloud/supabase/h-standby-promote/index.ts" | grep -Fq 'fenced_request_only'
          git show "$ref:cloud/supabase/h-standby-promote/fence-assertion.ts" | grep -Fq 'primary_write_fenced'
          git show "$ref:cloud/standby/supabase/h-standby-health/standby-health-policy.ts" | grep -Fq 'STANDBY_FENCING_CONTRACT'
          git show "$ref:cloud/supabase/h-standby-runtime-config/function-inventory.ts" | grep -Fq '"h-standby-promote"'
