name: H One-shot VPN Migration

on:
  push:
    branches:
      - integration/h-vpn-main-20260908
    paths:
      - .github/workflows/h-migrate-from-vpn.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout target integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/h-vpn-main-20260908
          fetch-depth: 0

      - name: Fetch authoritative H source history
        shell: bash
        run: |
          set -euo pipefail
          git remote add hsource https://github.com/Malik05255/vpn.git
          git fetch --no-tags hsource main
          echo "Shared merge base: $(git merge-base HEAD hsource/main)"

      - name: Merge source history while preserving newer target conflict choices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before="$(git rev-parse HEAD)"
          git merge --no-ff --no-commit -X ours hsource/main

          # Workflows were migrated/reviewed separately with the target's newer
          # Android CI preserved. Keep that reviewed workflow tree and exclude the
          # old lab bootstrap, which is specific to the source repository.
          git checkout "$before" -- .github/workflows
          if [ -e .github/workflows/h-lab-bootstrap.yml ]; then
            git rm -f .github/workflows/h-lab-bootstrap.yml
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge paths:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

          echo "## Source history merge" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged \`Malik05255/vpn@main\` into the H integration branch." >> "$GITHUB_STEP_SUMMARY"
          echo "Overlapping conflict hunks prefer the newer VibeApp-Fs side; non-conflicting source hunks are retained." >> "$GITHUB_STEP_SUMMARY"
          echo "Source-only lab bootstrap is excluded intentionally." >> "$GITHUB_STEP_SUMMARY"

          git commit -m 'merge(h): consolidate vpn main into VibeApp-Fs'
          git push origin HEAD:integration/h-vpn-main-20260908
