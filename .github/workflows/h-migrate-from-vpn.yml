name: H One-shot VPN Migration

on:
  push:
    branches:
      - integration/h-vpn-main-20260908
    paths:
      - .github/workflows/h-migrate-from-vpn.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target integration branch
        uses: actions/checkout@v5
        with:
          ref: integration/h-vpn-main-20260908
          fetch-depth: 0

      - name: Fetch authoritative H source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/Malik05255/vpn.git /tmp/h-vpn-source

      - name: Copy source-only Android H components
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/src/main/kotlin/com/malik/lmai/feature/agent/tool/HReminderTool.kt
            app/src/main/kotlin/com/malik/lmai/feature/agent/tool/PeachWhatsAppTool.kt
            app/src/main/kotlin/com/malik/lmai/feature/assistant/HOwnerIdentity.kt
            app/src/main/kotlin/com/malik/lmai/feature/mcp/PeachMcpClient.kt
            app/src/main/kotlin/com/malik/lmai/feature/mcp/PeachMcpLoopbackServer.kt
            app/src/main/kotlin/com/malik/lmai/feature/mcp/PeachMcpOAuthCallbackBus.kt
            app/src/main/kotlin/com/malik/lmai/feature/mcp/PeachMcpOAuthCoordinator.kt
            app/src/main/kotlin/com/malik/lmai/feature/mcp/PeachMcpSecureStore.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HGeofenceReceiver.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HLocationScope.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HLocationScopeStore.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HReminderBootReceiver.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HReminderModels.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HReminderNotifier.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HReminderRepository.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HReminderScheduler.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/HTimeReminderWorker.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/db/HReminderDao.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/db/HReminderDatabase.kt
            app/src/main/kotlin/com/malik/lmai/feature/reminder/db/HReminderEntity.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/h/PeachMcpSettingsScreen.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/h/PeachMcpSettingsViewModel.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HLocationScopeSettingsCard.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HLocationScopeViewModel.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HReminderMapEditor.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HReminderPermissions.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HRemindersScreen.kt
            app/src/main/kotlin/com/malik/lmai/presentation/ui/reminder/HRemindersViewModel.kt
            app/src/main/res/values/h_reminder_strings.xml
            app/src/main/res/values/strings_peach.xml
            app/src/main/res/values-ar/h_reminder_strings.xml
            app/src/main/res/values-ar/strings_peach.xml
            app/src/test/kotlin/com/malik/lmai/feature/reminder/HLocationScopeBoundsTest.kt
            app/src/test/kotlin/com/malik/lmai/feature/reminder/HLocationScopeTest.kt
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            cp "/tmp/h-vpn-source/$path" "$path"
          done
          printf '%s\n' "${files[@]}" > /tmp/h-added-files.txt

      - name: Check shared git ancestry
        shell: bash
        run: |
          set -euo pipefail
          git remote add hsource https://github.com/Malik05255/vpn.git
          git fetch --no-tags hsource main
          base="$(git merge-base HEAD hsource/main || true)"
          echo "Shared merge base: ${base:-NONE}"
          echo "H_MERGE_BASE=${base:-NONE}" >> "$GITHUB_ENV"

      - name: Commit source-only Android components
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs -d '\n' git add -- < /tmp/h-added-files.txt
          if git diff --cached --quiet; then
            echo 'No source-only Android files to commit.'
            exit 0
          fi
          git commit -m 'feat(h): import reminders location scope and Peach Android runtime'
          git push origin HEAD:integration/h-vpn-main-20260908
