name: ALMI Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: almi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ALMI APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard ALMI release signing identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_KEYSTORE_BLOB="713f25064a41595c7040f60bdaf0d15daf0d1435"
          ACTUAL_KEYSTORE_BLOB="$(git hash-object .github/almi_ai_dev_keystore.b64)"
          echo "ALMI keystore identity: $ACTUAL_KEYSTORE_BLOB"
          test "$ACTUAL_KEYSTORE_BLOB" = "$EXPECTED_KEYSTORE_BLOB"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Release APK
        run: ./gradlew --no-daemon app:assembleRelease

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk ALMI_AI.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ALMI_AI.apk | tee ALMI_APK_SIGNATURE.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' ALMI_APK_SIGNATURE.txt | head -n 1)"
          test -n "$CERT_SHA256"
          printf '%s\n' "$CERT_SHA256" > ALMI_SIGNING_CERT_SHA256.txt
          echo "ALMI release certificate SHA-256: $CERT_SHA256"

      - name: Upload ALMI APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMI_AI
          path: |
            ALMI_AI.apk
            ALMI_APK_SIGNATURE.txt
            ALMI_SIGNING_CERT_SHA256.txt
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew --no-daemon app:testDebugUnitTest

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Android Lint
        run: ./gradlew --no-daemon app:lintRelease
