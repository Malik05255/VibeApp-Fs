name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
  GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GITHUB_OAUTH_CLIENT_SECRET || secrets.OAUTH_CLIENT_SECRET }}
  GITHUB_OAUTH_REDIRECT_URI: ${{ vars.GITHUB_OAUTH_REDIRECT_URI || 'lmai://github-oauth' }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate OAuth configuration
        shell: bash
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID secret is missing."
            exit 1
          fi
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID does not look like a Google Web OAuth client ID."
            exit 1
          fi
          if [ -z "$GITHUB_OAUTH_CLIENT_ID" ]; then
            echo "::error::OAUTH_CLIENT_ID repository variable is missing. Add the GitHub OAuth App Client ID under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          if [[ ! "$GITHUB_OAUTH_CLIENT_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::OAUTH_CLIENT_ID has an unexpected format. Paste the GitHub OAuth App Client ID only."
            exit 1
          fi
          if [ -n "$GITHUB_OAUTH_CLIENT_SECRET" ]; then
            echo "GitHub authorization-code flow enabled; callback URI: $GITHUB_OAUTH_REDIRECT_URI"
          else
            echo "::warning::GitHub OAuth client secret is not configured. lm_AI will use Device Flow fallback."
          fi
          echo "OAuth configuration is present (values intentionally hidden)."

      - name: Restore or bootstrap persistent debug keystore
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/.android"
          KEYSTORE="$HOME/.config/.android/debug.keystore"

          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "Persistent debug keystore restored from GitHub Secret."
          else
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=lm_AI CI Debug,O=lm_AI,C=SA"
            base64 -w 0 "$KEYSTORE" > "$RUNNER_TEMP/android-debug-keystore.base64.txt"
            echo "source=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. A one-time bootstrap signing key was generated."
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null

      - name: Upload signing bootstrap artifact
        if: steps.signing.outputs.source == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: lm_AI-signing-bootstrap
          path: ${{ runner.temp }}/android-debug-keystore.base64.txt
          retention-days: 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print debug signing fingerprints
        run: ./gradlew --no-daemon app:signingReport

      - name: Build Debug APK
        if: steps.signing.outputs.source == 'secret'
        run: ./gradlew --no-daemon app:assembleDebug

      - name: Upload Debug APK
        if: steps.signing.outputs.source == 'secret'
        uses: actions/upload-artifact@v4
        with:
          name: lm_AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Require persistent signing secret
        if: steps.signing.outputs.source == 'bootstrap'
        shell: bash
        run: |
          echo "::error::A persistent signing key has been generated and uploaded as artifact 'lm_AI-signing-bootstrap'. Configure ANDROID_DEBUG_KEYSTORE_BASE64 and rerun."
          exit 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon app:testDebugUnitTest

  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew --no-daemon app:lintDebug

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, unit-tests, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lm_AI-debug-apk
          path: release

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          MINIMUM_VERSION_CODE=$(( VERSION_CODE > 1 ? VERSION_CODE - 1 : 1 ))
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="v${VERSION_NAME}-build.${GITHUB_RUN_NUMBER}"
          APK="release/lm_AI-${VERSION_NAME}-${SHORT_SHA}.apk"
          mv release/app-debug.apk "$APK"
          APK_NAME="$(basename "$APK")"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          printf '{\n  "latestVersionCode": %s,\n  "minimumVersionCode": %s,\n  "versionName": "%s",\n  "mandatory": false,\n  "apkAsset": "%s",\n  "apkUrl": "%s",\n  "sha256": "%s"\n}\n' \
            "$VERSION_CODE" "$MINIMUM_VERSION_CODE" "$VERSION_NAME" "$APK_NAME" "$APK_URL" "$SHA256" > release/update-manifest.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=lm_AI ${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate update package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME=$(jq -r '.apkAsset' release/update-manifest.json)
          EXPECTED_SHA=$(jq -r '.sha256' release/update-manifest.json)
          APK_URL=$(jq -r '.apkUrl' release/update-manifest.json)
          test -n "$APK_NAME"
          test -f "release/$APK_NAME"
          test "$EXPECTED_SHA" = "$(sha256sum "release/$APK_NAME" | awk '{print $1}')"
          [[ "$APK_URL" == https://github.com/${GITHUB_REPOSITORY}/releases/download/*/$APK_NAME ]]

      - name: Create release and upload update files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            release/*.apk release/update-manifest.json \
            --title "${{ steps.meta.outputs.name }}" \
            --notes "Automatic lm_AI update from successful main build ${GITHUB_SHA}."
