name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate Google OAuth configuration
        shell: bash
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID secret is missing. Add the Web OAuth client ID in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID does not look like a Google Web OAuth client ID."
            exit 1
          fi
          echo "Google Web Client ID is present (value intentionally hidden)."

      - name: Validate Supabase configuration
        shell: bash
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase secrets are missing. The APK will start safely, but cloud authentication/sync will remain disabled until SUPABASE_URL and SUPABASE_ANON_KEY are configured."
          else
            echo "Supabase configuration is present (values intentionally hidden)."
          fi

      - name: Restore or bootstrap persistent debug keystore
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/.android"
          KEYSTORE="$HOME/.config/.android/debug.keystore"

          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo "source=secret" >> "$GITHUB_OUTPUT"
            echo "Persistent debug keystore restored from GitHub Secret."
          else
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=lm_AI CI Debug,O=lm_AI,C=SA"
            base64 -w 0 "$KEYSTORE" > "$RUNNER_TEMP/android-debug-keystore.base64.txt"
            echo "source=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. A one-time bootstrap signing key was generated. Download the signing-bootstrap artifact and paste its text into the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret, then rerun the workflow."
          fi

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias AndroidDebugKey >/dev/null

      - name: Upload signing bootstrap artifact
        if: steps.signing.outputs.source == 'bootstrap'
        uses: actions/upload-artifact@v4
        with:
          name: lm_AI-signing-bootstrap
          path: ${{ runner.temp }}/android-debug-keystore.base64.txt
          retention-days: 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print debug signing fingerprints
        run: ./gradlew --no-daemon app:signingReport

      - name: Build Debug APK
        if: steps.signing.outputs.source == 'secret'
        run: ./gradlew --no-daemon app:assembleDebug

      - name: Upload Debug APK
        if: steps.signing.outputs.source == 'secret'
        uses: actions/upload-artifact@v4
        with:
          name: lm_AI-2.0.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Require persistent signing secret
        if: steps.signing.outputs.source == 'bootstrap'
        shell: bash
        run: |
          echo "::error::A persistent signing key has been generated and uploaded as artifact 'lm_AI-signing-bootstrap'. Download android-debug-keystore.base64.txt, create repository secret ANDROID_DEBUG_KEYSTORE_BASE64 with the full text, then rerun this workflow."
          exit 1

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon app:testDebugUnitTest

  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew --no-daemon app:lintDebug
