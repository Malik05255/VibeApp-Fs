name: ALMI_AI Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: almi-ai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed ALMI_AI release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Release APK and AAB
        run: ./gradlew --no-daemon app:assembleRelease app:bundleRelease

      - name: Name release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk ALMI_AI-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ALMI_AI-release.aab

      - name: Print signing certificate
        run: keytool -printcert -jarfile ALMI_AI-release.apk | head -30

      - name: Upload installable ALMI_AI Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMI_AI-release-apk
          path: ALMI_AI-release.apk

      - name: Upload Play-ready ALMI_AI AAB
        uses: actions/upload-artifact@v4
        with:
          name: ALMI_AI-release-aab
          path: ALMI_AI-release.aab

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Unit Tests
        run: ./gradlew --no-daemon app:testDebugUnitTest

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Android Lint
        run: ./gradlew --no-daemon app:lintRelease
