name: Deploy H Supabase Runtime

on:
  workflow_dispatch:
    inputs:
      function:
        description: H Supabase function to deploy
        required: true
        default: all
        type: choice
        options:
          - all
          - h-app-sync
          - h-openrouter-oauth
          - h-owner-config
          - h-portable-snapshot
          - h-provider-config
          - h-runtime-readiness
          - h-tavily-config
          - h-whatsapp-action
          - h-whatsapp-inbox
          - h-whatsapp-media
          - h-whatsapp-peach
  push:
    branches: [ "main" ]
    paths:
      - "cloud/supabase/**"
      - ".github/workflows/h-supabase-runtime-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-supabase-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TARGET_FUNCTION: ${{ inputs.function }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Supabase deployment configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'H Supabase deployment is not configured. Missing GitHub Actions secrets: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "H Supabase deployment configuration is present."
          fi

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment target
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_FUNCTION:-all}"
          allowed=(all h-app-sync h-openrouter-oauth h-owner-config h-portable-snapshot h-provider-config h-runtime-readiness h-tavily-config h-whatsapp-action h-whatsapp-inbox h-whatsapp-media h-whatsapp-peach)
          valid=false
          for item in "${allowed[@]}"; do
            if [ "$target" = "$item" ]; then valid=true; break; fi
          done
          if [ "$valid" != "true" ]; then echo "Unsupported H Supabase function: $target" >&2; exit 1; fi
          if [ "$target" != "all" ] && [ ! -f "cloud/supabase/$target/index.ts" ]; then
            echo "Function source is missing: cloud/supabase/$target/index.ts" >&2
            exit 1
          fi

      - name: Deploy H Supabase function(s)
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_FUNCTION:-all}"
          functions=(h-app-sync h-openrouter-oauth h-owner-config h-portable-snapshot h-provider-config h-runtime-readiness h-tavily-config h-whatsapp-action h-whatsapp-inbox h-whatsapp-media h-whatsapp-peach)
          if [ "$target" != "all" ]; then functions=("$target"); fi
          for fn in "${functions[@]}"; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Verify deployed function inventory
        id: inventory
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="${TARGET_FUNCTION:-all}"
          functions=(h-app-sync h-openrouter-oauth h-owner-config h-portable-snapshot h-provider-config h-runtime-readiness h-tavily-config h-whatsapp-action h-whatsapp-inbox h-whatsapp-media h-whatsapp-peach)
          if [ "$target" != "all" ]; then functions=("$target"); fi

          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          for fn in "${functions[@]}"; do
            if ! grep -Fq "$fn" <<< "$inventory"; then
              echo "Deployed function is missing from Supabase inventory: $fn" >&2
              exit 1
            fi
            echo "Verified deployed inventory entry: $fn"
          done
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe H app sync Google authentication boundary
        id: app_sync_probe
        if: >-
          steps.inventory.outputs.verified == 'true' &&
          (env.TARGET_FUNCTION == '' || env.TARGET_FUNCTION == 'all' || env.TARGET_FUNCTION == 'h-app-sync')
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"status"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-app-sync")"

          if [ "$status" != "401" ]; then
            echo "h-app-sync probe expected HTTP 401 without Google bearer token, got $status" >&2
            exit 1
          fi
          if ! grep -Fq 'google_sign_in_required' "$response_file"; then
            echo "h-app-sync probe reached the endpoint but did not return the expected Google authentication response." >&2
            exit 1
          fi
          echo "h-app-sync is reachable and its Google authentication boundary is active."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe H portable snapshot Google authentication boundary
        id: portable_snapshot_probe
        if: >-
          steps.inventory.outputs.verified == 'true' &&
          (env.TARGET_FUNCTION == '' || env.TARGET_FUNCTION == 'all' || env.TARGET_FUNCTION == 'h-portable-snapshot')
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-portable-snapshot")"

          if [ "$status" != "401" ]; then
            echo "h-portable-snapshot probe expected HTTP 401 without Google bearer token, got $status" >&2
            exit 1
          fi
          if ! grep -Fq 'google_sign_in_required' "$response_file"; then
            echo "h-portable-snapshot probe reached the endpoint but did not return the expected Google authentication response." >&2
            exit 1
          fi
          echo "h-portable-snapshot is reachable and its Google authentication boundary is active."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe H owner configuration authorization boundary
        id: owner_probe
        if: >-
          steps.inventory.outputs.verified == 'true' &&
          (env.TARGET_FUNCTION == '' || env.TARGET_FUNCTION == 'all' || env.TARGET_FUNCTION == 'h-owner-config')
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"status"}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-owner-config")"

          if [ "$status" != "401" ]; then
            echo "h-owner-config probe expected HTTP 401 without x-h-runtime-secret, got $status" >&2
            exit 1
          fi
          if ! grep -Fq 'Unauthorized' "$response_file"; then
            echo "h-owner-config probe reached the endpoint but did not return the expected application authorization response." >&2
            exit 1
          fi
          echo "h-owner-config is reachable and its application authorization boundary is active."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe H runtime readiness authorization boundary
        id: readiness_probe
        if: >-
          steps.inventory.outputs.verified == 'true' &&
          (env.TARGET_FUNCTION == '' || env.TARGET_FUNCTION == 'all' || env.TARGET_FUNCTION == 'h-runtime-readiness')
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-runtime-readiness")"

          if [ "$status" != "401" ]; then
            echo "h-runtime-readiness probe expected HTTP 401 without x-h-runtime-secret, got $status" >&2
            exit 1
          fi
          if ! grep -Fq 'Unauthorized' "$response_file"; then
            echo "h-runtime-readiness probe reached the endpoint but did not return the expected application authorization response." >&2
            exit 1
          fi
          echo "h-runtime-readiness is reachable and its application authorization boundary is active."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe H WhatsApp media authorization boundary
        id: media_probe
        if: >-
          steps.inventory.outputs.verified == 'true' &&
          (env.TARGET_FUNCTION == '' || env.TARGET_FUNCTION == 'all' || env.TARGET_FUNCTION == 'h-whatsapp-media')
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-whatsapp-media")"

          if [ "$status" != "401" ]; then
            echo "h-whatsapp-media probe expected HTTP 401 without x-h-runtime-secret, got $status" >&2
            exit 1
          fi
          if ! grep -Fq 'Unauthorized' "$response_file"; then
            echo "h-whatsapp-media probe reached the endpoint but did not return the expected application authorization response." >&2
            exit 1
          fi
          echo "h-whatsapp-media is reachable and its application authorization boundary is active."
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Report missing deployment configuration
        if: steps.preflight.outputs.ready != 'true'
        shell: bash
        run: |
          echo "::warning::H Supabase deployment was skipped because SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF are not configured as repository secrets."
          echo "No secret is stored in the repository or APK."

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## H Supabase Runtime"
            echo
            echo "Deployment target: \`${TARGET_FUNCTION:-all}\`"
            if [ "${{ steps.deploy.outputs.completed }}" = "true" ] && [ "${{ steps.inventory.outputs.verified }}" = "true" ]; then
              echo "Deployment status: **completed and inventory-verified**."
              if [ "${{ steps.app_sync_probe.outputs.verified }}" = "true" ]; then
                echo "App sync status: **endpoint reachable; Google authentication boundary verified**."
              fi
              if [ "${{ steps.portable_snapshot_probe.outputs.verified }}" = "true" ]; then
                echo "Portable snapshot status: **endpoint reachable; Google authentication boundary verified**."
              fi
              if [ "${{ steps.owner_probe.outputs.verified }}" = "true" ]; then
                echo "Owner configuration status: **endpoint reachable; application authorization boundary verified**."
              fi
              if [ "${{ steps.readiness_probe.outputs.verified }}" = "true" ]; then
                echo "Runtime readiness status: **endpoint reachable; application authorization boundary verified**."
              fi
              if [ "${{ steps.media_probe.outputs.verified }}" = "true" ]; then
                echo "WhatsApp media status: **endpoint reachable; application authorization boundary verified**."
              fi
            elif [ "${{ steps.preflight.outputs.ready }}" = "true" ]; then
              echo "Deployment status: **attempted but not verified**. Inspect the failed deployment or verification step."
            else
              echo "Deployment status: **skipped**. Configure \`SUPABASE_ACCESS_TOKEN\` and \`SUPABASE_PROJECT_REF\` as GitHub Actions secrets."
            fi
            echo
            echo "Supabase project ref is supplied only through GitHub Actions secrets."
            echo "H functions keep their existing application-level authentication and are deployed with Supabase JWT verification disabled so OAuth callbacks and custom authentication flows are not blocked at the gateway."
          } >> "$GITHUB_STEP_SUMMARY"
