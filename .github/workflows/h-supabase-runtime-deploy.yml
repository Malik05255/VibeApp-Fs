name: Deploy H Supabase Runtime

on:
  workflow_dispatch:
    inputs:
      function:
        description: H Edge Function to deploy (`all` or one cloud/supabase/h-* directory)
        required: true
        default: all
        type: string
      migration:
        description: Optional exact new migration path (must use a 14-digit timestamp filename)
        required: false
        default: ""
        type: string
  push:
    branches: [ "main" ]
    paths:
      - "cloud/supabase/**"
      - ".github/workflows/h-supabase-runtime-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-supabase-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TARGET_FUNCTION: ${{ inputs.function }}
      TARGET_MIGRATION: ${{ inputs.migration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Require production deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::H Supabase release blocked. Missing GitHub Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "H Supabase production credentials are configured."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize linked Supabase workdir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase
          supabase init
          supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Discover migrations and functions for this release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          migrations=()
          functions=()

          validate_migration() {
            local file="$1"
            local base
            base="$(basename "$file")"
            if [[ ! "$file" =~ ^cloud/supabase/migrations/[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error::New production migrations must use cloud/supabase/migrations/YYYYMMDDHHMMSS_name.sql: $file"
              exit 1
            fi
            if [ ! -f "$file" ]; then
              echo "::error::Migration file does not exist: $file"
              exit 1
            fi
          }

          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [[ "$before" =~ ^0+$ ]]; then
              before="$(git rev-parse HEAD^)"
            fi

            modified="$(git diff --diff-filter=M --name-only "$before" "$GITHUB_SHA" -- 'cloud/supabase/migrations/*.sql' || true)"
            if [ -n "$modified" ]; then
              echo "::error::Applied migrations are immutable. Add a new timestamped migration instead of editing:"
              echo "$modified"
              exit 1
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue
              validate_migration "$file"
              migrations+=("$file")
            done < <(git diff --diff-filter=A --name-only "$before" "$GITHUB_SHA" -- 'cloud/supabase/migrations/*.sql' || true)

            changed="$(git diff --name-only "$before" "$GITHUB_SHA" -- 'cloud/supabase/**' || true)"
            if grep -q '^cloud/supabase/_shared/' <<< "$changed"; then
              while IFS= read -r index; do
                functions+=("$(basename "$(dirname "$index")")")
              done < <(find cloud/supabase -mindepth 2 -maxdepth 2 -type f -path 'cloud/supabase/h-*/index.ts' | sort)
            else
              while IFS= read -r fn; do
                [ -z "$fn" ] && continue
                [ -f "cloud/supabase/$fn/index.ts" ] && functions+=("$fn")
              done < <(awk -F/ '$1=="cloud" && $2=="supabase" && $3 ~ /^h-/ {print $3}' <<< "$changed" | sort -u)
            fi
          else
            migration="${TARGET_MIGRATION:-}"
            if [ -n "$migration" ]; then
              validate_migration "$migration"
              migrations+=("$migration")
            fi

            target="${TARGET_FUNCTION:-all}"
            if [ "$target" = "all" ]; then
              while IFS= read -r index; do
                functions+=("$(basename "$(dirname "$index")")")
              done < <(find cloud/supabase -mindepth 2 -maxdepth 2 -type f -path 'cloud/supabase/h-*/index.ts' | sort)
            else
              if [[ ! "$target" =~ ^h-[a-z0-9-]+$ ]] || [ ! -f "cloud/supabase/$target/index.ts" ]; then
                echo "::error::Unsupported H Supabase function: $target"
                exit 1
              fi
              functions+=("$target")
            fi
          fi

          # Stable unique order.
          mapfile -t migrations < <(printf '%s\n' "${migrations[@]:-}" | sed '/^$/d' | sort -u)
          mapfile -t functions < <(printf '%s\n' "${functions[@]:-}" | sed '/^$/d' | sort -u)

          {
            echo 'migrations<<EOF'
            printf '%s\n' "${migrations[@]:-}"
            echo EOF
            echo 'functions<<EOF'
            printf '%s\n' "${functions[@]:-}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

          printf 'Migrations selected: %s\n' "${migrations[*]:-(none)}"
          printf 'Functions selected: %s\n' "${functions[*]:-(none)}"

      - name: Stage and apply new database migrations
        if: steps.release.outputs.migrations != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            cp "$file" "supabase/migrations/$(basename "$file")"
          done <<< "${{ steps.release.outputs.migrations }}"

          echo "Pending migration plan:"
          supabase db push --linked --dry-run
          supabase db push --linked --yes
          echo "Database migrations applied before Edge Function deployment."

      - name: Build immutable Edge Function wrappers
        if: steps.release.outputs.functions != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            mkdir -p "supabase/functions/$fn"
            cat > "supabase/functions/$fn/index.ts" <<EOF
          // Production wrapper pinned to repository commit ${GITHUB_SHA}.
          // Relative imports resolve from the same immutable GitHub commit.
          import "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/cloud/supabase/${fn}/index.ts";
          EOF
          done <<< "${{ steps.release.outputs.functions }}"

      - name: Deploy H Supabase function(s)
        id: deploy
        if: steps.release.outputs.functions != ''
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            echo "Deploying $fn pinned to $GITHUB_SHA"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          done <<< "${{ steps.release.outputs.functions }}"
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Verify deployed function inventory
        id: inventory
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          while IFS= read -r fn; do
            [ -z "$fn" ] && continue
            if ! grep -Fq "$fn" <<< "$inventory"; then
              echo "::error::Deployed function missing from Supabase inventory: $fn"
              exit 1
            fi
            echo "Verified inventory entry: $fn"
          done <<< "${{ steps.release.outputs.functions }}"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Probe critical H authorization boundaries
        if: steps.inventory.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          selected="${{ steps.release.outputs.functions }}"

          if grep -Fxq 'h-app-sync' <<< "$selected"; then
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data '{"action":"status"}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-app-sync")"
            if [ "$status" != "401" ] || ! grep -Fq 'google_sign_in_required' "$body"; then
              echo "::error::h-app-sync authentication probe failed (HTTP $status)."
              cat "$body"
              exit 1
            fi
            echo "h-app-sync authentication boundary verified."
          fi

          if grep -Fxq 'h-whatsapp-inbox' <<< "$selected"; then
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request POST --header 'Content-Type: application/json' --data '{}' \
              "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-whatsapp-inbox")"
            if [ "$status" != "401" ] || ! grep -Fqi 'unauthorized' "$body"; then
              echo "::error::h-whatsapp-inbox authorization probe failed (HTTP $status)."
              cat "$body"
              exit 1
            fi
            echo "h-whatsapp-inbox authorization boundary verified."
          fi

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## H Supabase Release"
            echo
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Migrations: \`${{ steps.release.outputs.migrations || 'none' }}\`"
            echo "Functions: \`${{ steps.release.outputs.functions || 'none' }}\`"
            if [ "${{ job.status }}" = "success" ]; then
              echo "Release status: **SUCCESS**. No skipped-success deployment path is allowed."
            else
              echo "Release status: **FAILED / NOT CERTIFIED**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
