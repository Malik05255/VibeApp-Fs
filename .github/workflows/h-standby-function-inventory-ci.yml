name: H Standby Function Inventory CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-standby-runtime-config/**"
      - ".github/workflows/h-standby-function-inventory-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-runtime-config/**"
      - ".github/workflows/h-standby-function-inventory-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check inventory provisioner
        run: deno check cloud/supabase/h-standby-runtime-config/index.ts cloud/supabase/h-standby-runtime-config/function-inventory.ts

      - name: Test inventory dependency closure policy
        run: deno test cloud/supabase/h-standby-runtime-config/function-inventory_test.ts

      - name: Assert required execution entrypoints exist at pinned bundles
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          inventory=cloud/supabase/h-standby-runtime-config/function-inventory.ts
          ref="$(sed -nE 's/^const STANDBY_BUNDLE_REF = "([0-9a-f]{40})";$/\1/p' "$config")"
          promoter_ref="$(sed -nE 's/^const RACE_SAFE_PROMOTER_BUNDLE_REF = "([0-9a-f]{40})";$/\1/p' "$inventory")"
          test -n "$ref"
          test -n "$promoter_ref"
          for slug in \
            h-ai-provider-app \
            h-ai-provider-config \
            h-app-media \
            h-app-sync \
            h-knowledge-verifier \
            h-learning-cycle \
            h-openrouter-oauth \
            h-owner-config \
            h-portable-restore \
            h-portable-snapshot \
            h-provider-config \
            h-reminder-sync \
            h-runtime-readiness \
            h-tavily-config \
            h-whatsapp-action \
            h-whatsapp-inbox \
            h-whatsapp-media \
            h-whatsapp-peach; do
            grep -Fq "\"$slug\"" "$inventory"
            git cat-file -e "$ref:cloud/supabase/$slug/index.ts"
          done
          grep -Fq '"h-standby-promote"' "$inventory"
          git cat-file -e "$promoter_ref:cloud/supabase/h-standby-promote/index.ts"
          git show "$promoter_ref:cloud/supabase/h-standby-promote/index.ts" | grep -Fq 'loadActivePromotionAttestation'
          git show "$promoter_ref:cloud/supabase/h-standby-promote/index.ts" | grep -Fq 'canonicalPromotionRequestId'

      - name: Assert inventory is verified and remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          inventory=cloud/supabase/h-standby-runtime-config/function-inventory.ts
          grep -Fq 'deployAndVerifyStandbyFunctionInventory' "$config"
          grep -Fq 'edge_functions:read' "$config"
          grep -Fq 'inventory.get(slug) !== "ACTIVE"' "$inventory"
          grep -Fq 'slug === "h-standby-promote"' "$inventory"
          grep -Fq 'cacheKey = `${options.bundleRef}:${path}`' "$inventory"
          grep -Fq "'function_inventory_ready', true" "$config"
          grep -Fq "'scheduler_active', false" "$config"
          grep -Fq "'autonomous_outbound_active', false" "$config"
          grep -Fq "'execution_runtime_ready', false" "$config"
          grep -Fq 'auto_failover_eligible: false' "$config"

      - name: Assert provisioning credentials never persist
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          grep -Fq 'management_token_persisted: false' "$config"
          grep -Fq 'github_token_persisted: false' "$config"
          if grep -E 'secret_(value|ciphertext)[^\n]*(managementToken|githubToken)' "$config"; then
            echo "One-time provisioning token persistence detected." >&2
            exit 1
          fi
