name: H Cloud Runtime CI

on:
  pull_request:
    paths:
      - "cloud/supabase/**"
      - ".github/workflows/h-cloud-runtime-ci.yml"
      - ".github/workflows/h-supabase-runtime-deploy.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/**"
      - ".github/workflows/h-cloud-runtime-ci.yml"
      - ".github/workflows/h-supabase-runtime-deploy.yml"

permissions:
  contents: read

jobs:
  deno-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check OpenRouter OAuth function
        run: deno check cloud/supabase/h-openrouter-oauth/index.ts

      - name: Type-check H provider configuration
        run: deno check cloud/supabase/h-provider-config/index.ts cloud/supabase/h-provider-config/provider-policy.ts

      - name: Type-check H runtime readiness probe
        run: deno check cloud/supabase/h-runtime-readiness/index.ts cloud/supabase/h-runtime-readiness/readiness-policy.ts

      - name: Type-check H owner configuration
        run: deno check cloud/supabase/h-owner-config/index.ts cloud/supabase/h-whatsapp-inbox/owner-identity.ts cloud/supabase/h-whatsapp-inbox/owner-pairing.ts cloud/supabase/h-whatsapp-inbox/friend-access.ts cloud/supabase/h-whatsapp-inbox/friend-pairing.ts

      - name: Type-check H app cloud sync
        run: deno check cloud/supabase/h-app-sync/index.ts cloud/supabase/h-app-sync/google-id-token.ts cloud/supabase/h-app-sync/shared-memory-policy.ts

      - name: Type-check H WhatsApp inbox runtime
        run: deno check cloud/supabase/h-whatsapp-inbox/index.ts cloud/supabase/h-whatsapp-inbox/channel-message.ts cloud/supabase/h-whatsapp-inbox/friend-access.ts cloud/supabase/h-whatsapp-inbox/friend-pairing.ts cloud/supabase/h-whatsapp-inbox/peach-media-fallback.ts

      - name: Type-check H WhatsApp media runtime
        run: deno check cloud/supabase/h-whatsapp-media/index.ts cloud/supabase/h-whatsapp-media/openrouter-media.ts cloud/supabase/h-whatsapp-inbox/media-bridge.ts

      - name: Type-check H route and lodging research engines
        run: deno check cloud/supabase/h-whatsapp-inbox/route-engine.ts cloud/supabase/h-whatsapp-inbox/route-places-engine.ts cloud/supabase/h-whatsapp-inbox/route-place-enhancer.ts cloud/supabase/h-whatsapp-inbox/lodging-research.ts cloud/supabase/h-whatsapp-inbox/research-router.ts

      - name: Test provider configuration policy
        run: deno test cloud/supabase/h-provider-config/provider-policy_test.ts

      - name: Test strict free-model policy
        run: deno test cloud/supabase/h-whatsapp-inbox/openrouter-ai_test.ts

      - name: Test isolated free media-model policy
        run: deno test cloud/supabase/h-whatsapp-media/openrouter-media_test.ts

      - name: Test H task priority policy
        run: deno test cloud/supabase/h-whatsapp-inbox/task-manager_test.ts

      - name: Test H WhatsApp voice bridge policy
        run: deno test cloud/supabase/h-whatsapp-inbox/voice-bridge_test.ts

      - name: Test H typed channel message bridge policy
        run: deno test cloud/supabase/h-whatsapp-inbox/channel-message_test.ts

      - name: Test H owner contact and external messaging policy
        run: deno test cloud/supabase/h-whatsapp-inbox/contact-manager_test.ts

      - name: Test H private owner identity policy
        run: deno test cloud/supabase/h-whatsapp-inbox/owner-identity_test.ts

      - name: Test H one-time owner pairing policy
        run: deno test cloud/supabase/h-whatsapp-inbox/owner-pairing_test.ts

      - name: Test H Google app-link identity policy
        run: deno test cloud/supabase/h-app-sync/google-id-token_test.ts

      - name: Test H shared cloud memory policy
        run: deno test cloud/supabase/h-app-sync/shared-memory-policy_test.ts

      - name: Test H one-time friend pairing policy
        run: deno test cloud/supabase/h-whatsapp-inbox/friend-pairing_test.ts

      - name: Test H owner-managed friend access policy
        run: deno test cloud/supabase/h-whatsapp-inbox/friend-access_test.ts

      - name: Test H Peach unsupported media fallback policy
        run: deno test cloud/supabase/h-whatsapp-inbox/peach-media-fallback_test.ts

      - name: Test H Peach runtime readiness policy
        run: deno test cloud/supabase/h-runtime-readiness/readiness-policy_test.ts

      - name: Test H free Peach contact delivery policy
        run: deno test cloud/supabase/h-whatsapp-inbox/peach-contact-delivery_test.ts

      - name: Test H WhatsApp media bridge policy
        run: deno test cloud/supabase/h-whatsapp-inbox/media-bridge_test.ts

      - name: Test H route policy
        run: deno test cloud/supabase/h-whatsapp-inbox/route-engine_test.ts

      - name: Test H route-aware place policy
        run: deno test cloud/supabase/h-whatsapp-inbox/route-places-engine_test.ts

      - name: Test H route detour enhancer
        run: deno test cloud/supabase/h-whatsapp-inbox/route-place-enhancer_test.ts

      - name: Test H lodging price policy
        run: deno test cloud/supabase/h-whatsapp-inbox/lodging-research_test.ts
