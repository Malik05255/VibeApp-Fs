name: Deploy H WhatsApp Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/whatsapp-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required GitHub secrets
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          CONTROL_WA_IDS: ${{ secrets.CONTROL_WA_IDS }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_ID VERIFY_TOKEN APP_SECRET ACCESS_TOKEN PHONE_NUMBER_ID GRAPH_VERSION CONTROL_WA_IDS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Inject D1 database id
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${D1_ID}/" wrangler.toml

      - name: Apply D1 schema
        run: wrangler d1 execute h-whatsapp --remote --file=schema.sql

      - name: Configure Worker secrets
        env:
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          CONTROL_WA_IDS: ${{ secrets.CONTROL_WA_IDS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          H_MODEL: ${{ secrets.H_MODEL }}
          WHATSAPP_REMINDER_TEMPLATE_NAME: ${{ secrets.WHATSAPP_REMINDER_TEMPLATE_NAME }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | wrangler secret put "$name"
            fi
          }
          put_secret WHATSAPP_VERIFY_TOKEN
          put_secret WHATSAPP_APP_SECRET
          put_secret WHATSAPP_ACCESS_TOKEN
          put_secret WHATSAPP_PHONE_NUMBER_ID
          put_secret META_GRAPH_VERSION
          put_secret CONTROL_WA_IDS
          put_secret OPENROUTER_API_KEY
          put_secret H_MODEL
          put_secret WHATSAPP_REMINDER_TEMPLATE_NAME

      - name: Deploy Worker
        run: wrangler deploy
