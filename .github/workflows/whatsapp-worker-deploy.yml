name: H WhatsApp Runtime Readiness / Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "cloud/whatsapp-worker/**"
      - ".github/workflows/whatsapp-worker-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/whatsapp-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check WhatsApp channel configuration
        id: preflight
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          CONTROL_WA_IDS: ${{ secrets.CONTROL_WA_IDS }}
          VOICE_URL: ${{ secrets.H_SUPABASE_VOICE_URL }}
          MEDIA_URL: ${{ secrets.H_SUPABASE_MEDIA_URL }}
          RUNTIME_SECRET: ${{ secrets.H_RUNTIME_SECRET }}
          STANDBY_VOICE_URL: ${{ secrets.H_STANDBY_SUPABASE_VOICE_URL }}
          STANDBY_RUNTIME_SECRET: ${{ secrets.H_STANDBY_RUNTIME_SECRET }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          TRANSCRIPTION_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_ID VERIFY_TOKEN APP_SECRET ACCESS_TOKEN PHONE_NUMBER_ID GRAPH_VERSION CONTROL_WA_IDS; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf 'H WhatsApp cloud runtime is not ready. Missing configuration: %s\n' "${missing[*]}"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "H WhatsApp cloud-only configuration is complete."
          fi

          text_missing=()
          if [ -z "${VOICE_URL:-}" ]; then text_missing+=("H_SUPABASE_VOICE_URL"); fi
          if [ -z "${RUNTIME_SECRET:-}" ]; then text_missing+=("H_RUNTIME_SECRET"); fi
          if [ "${#text_missing[@]}" -gt 0 ]; then
            echo "text_ready=false" >> "$GITHUB_OUTPUT"
            printf 'H WhatsApp unified text ingress is not ready. Missing configuration: %s\n' "${text_missing[*]}"
          else
            echo "text_ready=true" >> "$GITHUB_OUTPUT"
            echo "H WhatsApp text/location/button ingress can use the unified H runtime."
          fi

          voice_missing=()
          if [ -z "${VOICE_URL:-}" ]; then voice_missing+=("H_SUPABASE_VOICE_URL"); fi
          if [ -z "${RUNTIME_SECRET:-}" ]; then voice_missing+=("H_RUNTIME_SECRET"); fi
          if [ -z "${GROQ_KEY:-}" ] && [ -z "${TRANSCRIPTION_KEY:-}" ]; then
            voice_missing+=("GROQ_API_KEY|TRANSCRIPTION_API_KEY")
          fi
          if [ "${#voice_missing[@]}" -gt 0 ]; then
            echo "voice_ready=false" >> "$GITHUB_OUTPUT"
            printf 'H WhatsApp voice is not ready. Missing configuration: %s\n' "${voice_missing[*]}"
          else
            echo "voice_ready=true" >> "$GITHUB_OUTPUT"
            echo "H WhatsApp voice bridge and transcription configuration are present."
          fi

          media_missing=()
          if [ -z "${MEDIA_URL:-}" ] && [ -z "${VOICE_URL:-}" ]; then
            media_missing+=("H_SUPABASE_MEDIA_URL|H_SUPABASE_VOICE_URL")
          fi
          if [ -z "${RUNTIME_SECRET:-}" ]; then media_missing+=("H_RUNTIME_SECRET"); fi
          if [ "${#media_missing[@]}" -gt 0 ]; then
            echo "media_ready=false" >> "$GITHUB_OUTPUT"
            printf 'H WhatsApp media bridge is not ready. Missing configuration: %s\n' "${media_missing[*]}"
          else
            echo "media_ready=true" >> "$GITHUB_OUTPUT"
            echo "H WhatsApp media bridge configuration is present."
          fi

          standby_missing=()
          if [ -z "${STANDBY_VOICE_URL:-}" ]; then standby_missing+=("H_STANDBY_SUPABASE_VOICE_URL"); fi
          if [ -z "${STANDBY_RUNTIME_SECRET:-}" ]; then standby_missing+=("H_STANDBY_RUNTIME_SECRET"); fi
          if [ "${#standby_missing[@]}" -gt 0 ]; then
            echo "standby_ready=false" >> "$GITHUB_OUTPUT"
            printf 'H standby failover remains disabled. Missing configuration: %s\n' "${standby_missing[*]}"
          else
            echo "standby_ready=true" >> "$GITHUB_OUTPUT"
            echo "H standby failover routing configuration is complete."
          fi

      - name: Install Wrangler
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --global wrangler@4

      - name: Validate Worker syntax and ingress policy
        run: |
          node --check src/index.js
          node --check src/router.js
          node --check src/router-scheduled.js
          node --test src/router_test.mjs
          node --test src/router_scheduled_test.mjs
          node --test src/router_failover_contract_test.mjs

      - name: Inject D1 database id
        if: steps.preflight.outputs.ready == 'true'
        env:
          D1_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: sed -i "s/REPLACE_WITH_D1_DATABASE_ID/${D1_ID}/" wrangler.toml

      - name: Apply D1 schema
        if: steps.preflight.outputs.ready == 'true'
        run: wrangler d1 execute h-whatsapp --remote --file=schema.sql

      - name: Configure Worker secrets
        if: steps.preflight.outputs.ready == 'true'
        env:
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          CONTROL_WA_IDS: ${{ secrets.CONTROL_WA_IDS }}
          H_ALLOWED_WA_IDS: ${{ secrets.H_ALLOWED_WA_IDS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          H_MODEL: ${{ secrets.H_MODEL }}
          H_SYSTEM_PROMPT: ${{ secrets.H_SYSTEM_PROMPT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          WHATSAPP_REMINDER_TEMPLATE_NAME: ${{ secrets.WHATSAPP_REMINDER_TEMPLATE_NAME }}
          H_SUPABASE_VOICE_URL: ${{ secrets.H_SUPABASE_VOICE_URL }}
          H_SUPABASE_MEDIA_URL: ${{ secrets.H_SUPABASE_MEDIA_URL }}
          H_RUNTIME_SECRET: ${{ secrets.H_RUNTIME_SECRET }}
          H_STANDBY_SUPABASE_VOICE_URL: ${{ secrets.H_STANDBY_SUPABASE_VOICE_URL }}
          H_STANDBY_RUNTIME_SECRET: ${{ secrets.H_STANDBY_RUNTIME_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then printf '%s' "$value" | wrangler secret put "$name"; fi
          }
          put_secret WHATSAPP_VERIFY_TOKEN
          put_secret WHATSAPP_APP_SECRET
          put_secret WHATSAPP_ACCESS_TOKEN
          put_secret WHATSAPP_PHONE_NUMBER_ID
          put_secret META_GRAPH_VERSION
          put_secret CONTROL_WA_IDS
          put_secret H_ALLOWED_WA_IDS
          put_secret OPENROUTER_API_KEY
          put_secret H_MODEL
          put_secret H_SYSTEM_PROMPT
          put_secret GROQ_API_KEY
          put_secret TRANSCRIPTION_API_KEY
          put_secret WHATSAPP_REMINDER_TEMPLATE_NAME
          put_secret H_SUPABASE_VOICE_URL
          put_secret H_SUPABASE_MEDIA_URL
          put_secret H_RUNTIME_SECRET

          # Standby credentials are optional, but the enable flag is always rewritten so a
          # removed/partial GitHub configuration cannot leave stale Cloudflare failover active.
          if [ -n "${H_STANDBY_SUPABASE_VOICE_URL:-}" ] && [ -n "${H_STANDBY_RUNTIME_SECRET:-}" ]; then
            put_secret H_STANDBY_SUPABASE_VOICE_URL
            put_secret H_STANDBY_RUNTIME_SECRET
            printf '%s' 'true' | wrangler secret put H_STANDBY_FAILOVER_ENABLED
          else
            printf '%s' 'false' | wrangler secret put H_STANDBY_FAILOVER_ENABLED
          fi

      - name: Deploy Worker
        id: deploy_worker
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          wrangler deploy
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Report missing WhatsApp configuration
        if: steps.preflight.outputs.ready != 'true'
        run: |
          echo "Worker deployment was NOT performed because the required Cloudflare/Meta secrets are not configured."
          echo "This run only validated repository code; it must not be interpreted as a production deployment."
          echo "The Android app is not used as a WhatsApp event trigger in this architecture."

      - name: Report H channel readiness and deployment truth
        if: always()
        run: |
          deployed="${{ steps.deploy_worker.outputs.deployed }}"
          if [ "$deployed" != "true" ]; then deployed="false"; fi
          {
            echo "## H WhatsApp runtime status"
            echo
            echo "Production Worker deployed in this run: \`$deployed\`"
            echo "Core WhatsApp runtime ready: \`${{ steps.preflight.outputs.ready }}\`"
            echo "Unified text/location/button ingress ready: \`${{ steps.preflight.outputs.text_ready }}\`"
            echo "Voice Note bridge ready: \`${{ steps.preflight.outputs.voice_ready }}\`"
            echo "Image/document bridge ready: \`${{ steps.preflight.outputs.media_ready }}\`"
            echo "Standby failover routing configured: \`${{ steps.preflight.outputs.standby_ready }}\`"
            echo
            if [ "$deployed" != "true" ]; then
              echo "No production deployment occurred in this run. Green validation steps do not mean the Worker was deployed."
            else
              echo "The Worker deployment command completed successfully in this run."
            fi
            if [ "${{ steps.preflight.outputs.text_ready }}" != "true" ]; then
              echo "Text still uses the local D1 fallback until \`H_SUPABASE_VOICE_URL\` and \`H_RUNTIME_SECRET\` are configured."
            else
              echo "Text, location, button and interactive replies are routed to the same Supabase H memory/task runtime as voice and media-derived context."
            fi
            if [ "${{ steps.preflight.outputs.voice_ready }}" != "true" ]; then
              echo "Voice Note E2E is not ready until \`H_SUPABASE_VOICE_URL\`, \`H_RUNTIME_SECRET\`, and either \`GROQ_API_KEY\` or \`TRANSCRIPTION_API_KEY\` are configured as repository secrets."
            else
              echo "Voice-specific configuration is present. A real Meta Voice Note E2E test is still required before claiming production readiness."
            fi
            if [ "${{ steps.preflight.outputs.media_ready }}" != "true" ]; then
              echo "Media E2E needs \`H_RUNTIME_SECRET\` and either explicit \`H_SUPABASE_MEDIA_URL\` or a standard \`H_SUPABASE_VOICE_URL\` from which the media endpoint can be derived."
            else
              echo "Media bridge configuration is present. Strict-free model availability and a real Meta image/PDF E2E test are still required before claiming production readiness."
            fi
            if [ "${{ steps.preflight.outputs.standby_ready }}" != "true" ]; then
              echo "Standby failover remains disabled until both \`H_STANDBY_SUPABASE_VOICE_URL\` and \`H_STANDBY_RUNTIME_SECRET\` are configured."
            else
              echo "Standby endpoint and runtime secret are present; request-only promotion remains guarded by runtime health and promotion attestations."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail manual deployment when production configuration is missing
        if: github.event_name == 'workflow_dispatch' && steps.preflight.outputs.ready != 'true'
        run: |
          echo "Manual deploy requested, but production configuration is incomplete. Nothing was deployed." >&2
          exit 1
