name: H Standby Runtime Provisioner CI

on:
  pull_request:
    paths:
      - "cloud/supabase/h-standby-runtime-app/**"
      - "cloud/supabase/h-standby-runtime-config/**"
      - "cloud/supabase/h-standby-replicator/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/**"
      - "app/src/main/kotlin/com/malik/lmai/feature/assistant/HStandbyRuntimeClient.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HBackupCloudViewModel.kt"
      - "app/src/main/kotlin/com/malik/lmai/presentation/ui/h/HBackupCloudSettingsCard.kt"
      - "app/src/main/res/values/h_backup_cloud_strings.xml"
      - "app/src/main/res/values-ar/h_backup_cloud_strings.xml"
      - ".github/workflows/h-standby-runtime-provisioner-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-runtime-app/**"
      - "cloud/supabase/h-standby-runtime-config/**"
      - "cloud/supabase/h-standby-replicator/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/**"
      - ".github/workflows/h-standby-runtime-provisioner-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check standby provisioning runtime
        run: >-
          deno check
          cloud/supabase/h-standby-runtime-app/index.ts
          cloud/supabase/h-standby-runtime-config/index.ts
          cloud/supabase/h-standby-replicator/index.ts
          cloud/standby/supabase/h-standby-health/index.ts

      - name: Test standby health policy
        run: deno test cloud/standby/supabase/h-standby-health/standby-health-policy_test.ts

      - name: Assert management token is one-time and never persisted
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          app=cloud/supabase/h-standby-runtime-app/index.ts
          grep -Fq 'management_token_persisted: false' "$config"
          grep -Fq 'management_token_persisted: false' "$app"
          grep -Fq 'managementTokenInApk: false' "$app"
          grep -Fq 'managementTokenPersisted: false' "$app"
          if grep -Eq 'secret_ciphertext[^\n]*managementToken|management_token[^\n]*(insert|upsert|update)' "$config"; then
            echo "Management token persistence detected." >&2
            exit 1
          fi
          if grep -R -E 'management_token|SUPABASE_ACCESS_TOKEN|sbp_[A-Za-z0-9]' app/src/main --include='*.kt' --include='*.xml'; then
            echo "Supabase management credential material must not enter Android." >&2
            exit 1
          fi

      - name: Assert immutable standby bundle and safe base bootstrap
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          schema=cloud/standby/supabase/migrations/20260910_h_standby_base_schema.sql
          grep -Eq 'const STANDBY_BUNDLE_REF = "[0-9a-f]{40}";' "$config"
          grep -Fq 'inspectStandbyBaseSchema' "$config"
          grep -Fq 'schema.state === "partial"' "$config"
          grep -Fq 'schema.state === "empty"' "$config"
          grep -Fq '20260910_h_standby_base_schema.sql' "$config"
          grep -Fq 'standby_base_schema_bootstrap_incomplete' "$config"
          grep -Fq 'projectRef === projectRefFromEndpoint(primaryUrl)' "$config"
          grep -Fq 'edge_functions:write' "$config"
          grep -Fq 'database:write' "$config"
          for table in h_runtime_state h_runtime_config h_runtime_inbox h_runtime_memories h_runtime_contacts h_runtime_tasks h_runtime_reminders h_runtime_learning_state h_runtime_knowledge_gaps h_runtime_verified_knowledge; do
            grep -Fq "create table if not exists public.$table" "$schema"
            grep -Fq "alter table public.$table enable row level security" "$schema"
          done

      - name: Assert standby base schema is passive and primary-isolated
        shell: bash
        run: |
          set -euo pipefail
          schema=cloud/standby/supabase/migrations/20260910_h_standby_base_schema.sql
          case "$schema" in cloud/standby/*) ;; *) echo "Standby schema escaped standby tree" >&2; exit 1;; esac
          executable_sql="$(grep -Ev '^[[:space:]]*--' "$schema")"
          if printf '%s\n' "$executable_sql" | grep -Eiq 'cron[.]schedule|net[.]http|webhook|openrouter|provider_registry|runtime_credentials|ai_credentials|whatsapp_access_token|meta_access_token'; then
            echo "Standby base schema contains active/credential-bearing primary behavior." >&2
            exit 1
          fi
          test ! -e cloud/supabase/migrations/20260910_h_standby_base_schema.sql
          grep -Fq "'raw_message_bodies_replicated', false" cloud/standby/supabase/migrations/20260910_h_standby_replica_protocol.sql

      - name: Assert provisioning cannot enable failover
        shell: bash
        run: |
          set -euo pipefail
          config=cloud/supabase/h-standby-runtime-config/index.ts
          app=cloud/supabase/h-standby-runtime-app/index.ts
          grep -Fq 'auto_failover_eligible: false' "$config"
          grep -Fq 'standby_runtime_ready: false' "$config"
          grep -Fq 'standby_replication_ready: false' "$config"
          grep -Fq 'autoFailoverEnabled: false' "$app"

      - name: Assert replicator separates mirror health from promotion-aware failover eligibility
        shell: bash
        run: |
          set -euo pipefail
          worker=cloud/supabase/h-standby-replicator/index.ts
          policy=cloud/supabase/h-standby-replicator/replication-health-policy.ts
          grep -Fq 'standby_runtime_provisioned !== true' "$worker"
          grep -Fq 'standby_health_service_deployed !== true' "$worker"
          grep -Fq 'probeStandbyHealth' "$worker"
          grep -Fq 'replicationHealthEligible(health)' "$worker"
          grep -Fq 'syncStandbyAiContinuity' "$worker"
          grep -Fq 'prepareStandbyPromotion' "$worker"
          grep -Fq 'const promotionControlsReady = promotionPreflight?.ready === true' "$worker"
          grep -Fq 'health?.preflightReady === true' "$worker"
          grep -Fq 'const failoverEligible = promotionControlsReady && aiContinuityReady;' "$worker"
          grep -Fq 'standby_replication_ready: true' "$worker"
          grep -Fq 'standby_ai_credentials_rekey_ready: aiCredentialsReady' "$worker"
          grep -Fq 'auto_failover_eligible: failoverEligible' "$worker"
          grep -Fq 'standby_runtime_ready: false' "$worker"
          grep -Fq 'runtime_health_ok: false' "$worker"
          grep -Fq 'auto_failover_eligible: false' "$worker"
          if grep -Fq 'health?.standbyReady === true' "$policy"; then
            echo "Replication transport health must not depend on final promotion readiness." >&2
            exit 1
          fi
