name: H Media Branch Patch

on:
  push:
    branches: [ "feature/h-whatsapp-media" ]
    paths:
      - ".github/workflows/h-media-branch-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/h-whatsapp-media
          fetch-depth: 0

      - name: Apply guarded worker patch
        run: python3 .github/scripts/apply_h_media_patch.py

      - name: Validate worker syntax
        run: node --check cloud/whatsapp-worker/src/index.js

      - name: Commit worker integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/whatsapp-worker/src/index.js
          git diff --cached --check
          git commit -m "feat(h): receive WhatsApp images and documents"
          git push origin HEAD:feature/h-whatsapp-media
