name: H Media Branch Patch

on:
  push:
    branches: [ "feature/h-whatsapp-media" ]
    paths:
      - ".github/workflows/h-media-branch-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/h-whatsapp-media
          fetch-depth: 0

      - name: Apply guarded worker patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("cloud/whatsapp-worker/src/index.js")
          text = path.read_text()

          old = '''  const voiceBridgeConfigured = Boolean(env.H_SUPABASE_VOICE_URL && env.H_RUNTIME_SECRET);\n  const voiceConfigured = metaConfigured && voiceTranscriptionConfigured && voiceBridgeConfigured;\n  const templateConfigured = Boolean(env.WHATSAPP_REMINDER_TEMPLATE_NAME);'''
          new = '''  const voiceBridgeConfigured = Boolean(env.H_SUPABASE_VOICE_URL && env.H_RUNTIME_SECRET);\n  const voiceConfigured = metaConfigured && voiceTranscriptionConfigured && voiceBridgeConfigured;\n  const mediaBridgeConfigured = Boolean(env.H_RUNTIME_SECRET && (env.H_SUPABASE_MEDIA_URL || env.H_SUPABASE_VOICE_URL));\n  const mediaConfigured = metaConfigured && mediaBridgeConfigured;\n  const templateConfigured = Boolean(env.WHATSAPP_REMINDER_TEMPLATE_NAME);'''
          assert text.count(old) == 1, "health marker mismatch"
          text = text.replace(old, new)

          old = '''    voiceConfigured,\n    voiceTranscriptionConfigured,\n    voiceBridgeConfigured,\n    templateConfigured,'''
          new = '''    voiceConfigured,\n    voiceTranscriptionConfigured,\n    voiceBridgeConfigured,\n    mediaConfigured,\n    mediaBridgeConfigured,\n    templateConfigured,'''
          assert text.count(old) == 1, "health response marker mismatch"
          text = text.replace(old, new)

          old = '''        if (!inbound.text) {\n          await sendAssistantText(\n            env,\n            from,\n            "وصلتني الرسالة، لكن هذا النوع غير مدعوم في H السحابي حاليًا. أرسل نصًا أو مقطعًا صوتيًا.",\n          );\n          continue;\n        }\n\n        if (message.type === "audio") {'''
          new = '''        if (inbound.media) {\n          if (!env.H_RUNTIME_SECRET || (!env.H_SUPABASE_MEDIA_URL && !env.H_SUPABASE_VOICE_URL)) {\n            await sendAssistantText(\n              env,\n              from,\n              "وصلتني الوسائط، لكن ربط الصور والملفات بذاكرة H الموحدة غير مفعّل بعد، لذلك لم أحللها.",\n            );\n            continue;\n          }\n          try {\n            const media = await downloadWhatsAppMediaForH(env, inbound.media);\n            const bridged = await bridgeMediaMessage(env, from, message.id, media, message.timestamp);\n            if (bridged?.duplicate) continue;\n            if (bridged?.reply) {\n              await sendAssistantText(env, from, bridged.reply);\n            } else {\n              await sendAssistantText(env, from, "فهمت الوسائط، لكن H لم يُرجع نتيجة قابلة للإرسال.");\n            }\n          } catch (error) {\n            console.error("Unified H media bridge failed", error);\n            const detail = String(error?.message || error);\n            if (detail.includes("no_strictly_free_media_analysis_available")) {\n              await sendAssistantText(\n                env,\n                from,\n                "وصلتني الصورة أو الملف، لكن ما فيه الآن مسار فهم مجاني متاح. لم أستخدم أي مسار مدفوع.",\n              );\n            } else {\n              await sendAssistantText(\n                env,\n                from,\n                "وصلتني الصورة أو الملف، لكن تعذر تحليله الآن. لم أنفذ أي إجراء بناءً على محتوى غير مؤكد.",\n              );\n            }\n          }\n          continue;\n        }\n\n        if (!inbound.text) {\n          await sendAssistantText(\n            env,\n            from,\n            "وصلتني الرسالة، لكن هذا النوع غير مدعوم في H السحابي حاليًا. أرسل نصًا أو صوتًا أو صورة أو PDF/ملفًا نصيًا مدعومًا.",\n          );\n          continue;\n        }\n\n        if (message.type === "audio") {'''
          assert text.count(old) == 1, "message routing marker mismatch"
          text = text.replace(old, new)

          old = '''  if (message.type === "audio") {\n    const mediaId = message?.audio?.id;'''
          new = '''  if (message.type === "image" || message.type === "document") {\n    const value = message?.[message.type] || {};\n    const mediaId = value?.id;\n    if (!mediaId) {\n      return {\n        text: "",\n        error: message.type === "image"\n          ? "وصلتني الصورة لكن لم يصل معرّف الوسائط من واتساب."\n          : "وصلني الملف لكن لم يصل معرّف الوسائط من واتساب.",\n      };\n    }\n    return {\n      text: "",\n      media: {\n        kind: message.type,\n        mediaId: String(mediaId),\n        declaredMimeType: String(value?.mime_type || "").trim(),\n        fileName: String(value?.filename || "").trim(),\n        caption: String(value?.caption || "").trim(),\n      },\n    };\n  }\n  if (message.type === "audio") {\n    const mediaId = message?.audio?.id;'''
          assert text.count(old) == 1, "normalize media marker mismatch"
          text = text.replace(old, new)

          marker = '''async function transcribeWhatsAppAudio(env, mediaId) {'''
          insert = r'''const H_MEDIA_MAX_BYTES = 8 * 1024 * 1024;

async function downloadWhatsAppMediaForH(env, mediaRef) {
  const version = requireMetaGraphVersion(env);
  const metadataResponse = await fetch(
    `https://graph.facebook.com/${version}/${encodeURIComponent(mediaRef.mediaId)}`,
    { headers: { Authorization: `Bearer ${env.WHATSAPP_ACCESS_TOKEN}` } },
  );
  const metadataText = await metadataResponse.text();
  if (!metadataResponse.ok) {
    throw new Error(`Meta media metadata failed (${metadataResponse.status}): ${metadataText.slice(0, 300)}`);
  }
  const metadata = metadataText ? JSON.parse(metadataText) : {};
  if (!metadata.url) throw new Error("Meta media metadata did not include a download URL");

  const declaredSize = Number(metadata.file_size || 0);
  if (Number.isFinite(declaredSize) && declaredSize > H_MEDIA_MAX_BYTES) {
    throw new Error(`WhatsApp media exceeds H safe bridge limit (${H_MEDIA_MAX_BYTES} bytes)`);
  }

  const mediaResponse = await fetch(metadata.url, {
    headers: { Authorization: `Bearer ${env.WHATSAPP_ACCESS_TOKEN}` },
  });
  if (!mediaResponse.ok) throw new Error(`Meta media download failed (${mediaResponse.status})`);
  const blob = await mediaResponse.blob();
  if (!blob.size || blob.size > H_MEDIA_MAX_BYTES) {
    throw new Error(`WhatsApp media size is outside H safe bridge limit (${blob.size} bytes)`);
  }

  const mimeType = String(metadata.mime_type || blob.type || mediaRef.declaredMimeType || "")
    .split(";", 1)[0]
    .trim()
    .toLowerCase();
  if (!mimeType) throw new Error("WhatsApp media MIME type is unavailable");

  return {
    kind: mediaRef.kind,
    mimeType,
    fileName: String(mediaRef.fileName || "").slice(0, 160),
    caption: String(mediaRef.caption || "").slice(0, 2000),
    sizeBytes: blob.size,
    base64: arrayBufferToBase64(await blob.arrayBuffer()),
  };
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  const chunks = [];
  const chunkSize = 0x8000;
  for (let offset = 0; offset < bytes.length; offset += chunkSize) {
    chunks.push(String.fromCharCode(...bytes.subarray(offset, offset + chunkSize)));
  }
  return btoa(chunks.join(""));
}

function mediaBridgeEndpoint(env) {
  const explicit = String(env.H_SUPABASE_MEDIA_URL || "").trim();
  if (explicit) return explicit;
  const voice = String(env.H_SUPABASE_VOICE_URL || "").trim();
  if (!voice) throw new Error("Unified H media bridge is not configured");
  if (/\/h-whatsapp-inbox\/?(?:\?.*)?$/.test(voice)) {
    return voice.replace(/\/h-whatsapp-inbox\/?(?=\?|$)/, "/h-whatsapp-media");
  }
  throw new Error("H_SUPABASE_MEDIA_URL is required when the inbox URL cannot be derived");
}

async function bridgeMediaMessage(env, waId, messageId, media, timestamp) {
  const endpoint = mediaBridgeEndpoint(env);
  const secret = String(env.H_RUNTIME_SECRET || "").trim();
  if (!secret) throw new Error("Unified H media bridge secret is not configured");

  const receivedAtMs = Number(timestamp) * 1000;
  const response = await fetch(endpoint, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-h-runtime-secret": secret,
    },
    body: JSON.stringify({
      mode: "media_message",
      wa_id: normalizeWaId(waId),
      message_id: String(messageId || "").slice(0, 200),
      kind: media.kind,
      mime_type: media.mimeType,
      file_name: media.fileName || null,
      caption: media.caption || null,
      base64: media.base64,
      received_at: Number.isFinite(receivedAtMs) && receivedAtMs > 0
        ? new Date(receivedAtMs).toISOString()
        : new Date().toISOString(),
    }),
  });
  const text = await response.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (_) {}
  if (!response.ok || data?.ok === false) {
    throw new Error(`H media bridge rejected request (${response.status}): ${String(data?.error || text).slice(0, 300)}`);
  }
  return data;
}

'''
          assert text.count(marker) == 1, "transcription marker mismatch"
          text = text.replace(marker, insert + marker)

          path.write_text(text)
          PY

      - name: Commit worker integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/whatsapp-worker/src/index.js
          git diff --cached --check
          git commit -m "feat(h): receive WhatsApp images and documents"
          git push origin HEAD:feature/h-whatsapp-media
