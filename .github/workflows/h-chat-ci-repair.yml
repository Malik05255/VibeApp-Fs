name: H chat CI repair

on:
  push:
    branches:
      - fix/h-chat-send-media
    paths:
      - .github/workflows/h-chat-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/h-chat-send-media
          fetch-depth: 0

      - name: Repair constructor compatibility
        run: python3 .github/scripts/h-chat-ci-repair.py

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'private val hAppMediaPreprocessor: HAppMediaPreprocessor? = null' app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt
          grep -q 'hAppMediaPreprocessor?.prepare(request) ?: request' app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/malik/lmai/feature/agent/loop/ProviderAgentGatewayRouter.kt
          git commit -m "fix(h): keep router constructor test-compatible"
          git push origin HEAD:fix/h-chat-send-media
