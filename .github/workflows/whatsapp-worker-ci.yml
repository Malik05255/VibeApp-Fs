name: WhatsApp Worker CI

on:
  push:
    paths:
      - "cloud/whatsapp-worker/**"
      - ".github/workflows/whatsapp-worker-ci.yml"
      - ".github/workflows/whatsapp-worker-deploy.yml"
  pull_request:
    paths:
      - "cloud/whatsapp-worker/**"
      - ".github/workflows/whatsapp-worker-ci.yml"
      - ".github/workflows/whatsapp-worker-deploy.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check worker JavaScript syntax
        run: |
          node --check cloud/whatsapp-worker/src/index.js
          node --check cloud/whatsapp-worker/src/router.js
          node --check cloud/whatsapp-worker/src/router-scheduled.js
      - name: Test secure H ingress routing
        run: |
          node --test cloud/whatsapp-worker/src/router_test.mjs
          node --test cloud/whatsapp-worker/src/router_scheduled_test.mjs
          node --test cloud/whatsapp-worker/src/router_failover_contract_test.mjs
      - name: Assert deployment truth contract
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/whatsapp-worker-deploy.yml
          grep -Fq 'name: H WhatsApp Runtime Readiness / Deploy' "$workflow"
          grep -Fq 'id: deploy_worker' "$workflow"
          grep -Fq 'echo "deployed=true" >> "$GITHUB_OUTPUT"' "$workflow"
          grep -Fq 'Production Worker deployed in this run:' "$workflow"
          grep -Fq 'Green validation steps do not mean the Worker was deployed.' "$workflow"
          grep -Fq "if: github.event_name == 'workflow_dispatch' && steps.preflight.outputs.ready != 'true'" "$workflow"
          grep -Fq 'Nothing was deployed.' "$workflow"
