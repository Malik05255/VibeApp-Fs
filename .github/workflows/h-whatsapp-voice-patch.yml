        await sendConversationReply(accessToken, Number(reminder.conversation_id), text);
      }''')

          send_anchor = 'async function sendConversationReply(accessToken: string, conversationId: number, text: string) {'
          meta_sender = r'''async function sendMetaReminder(targetWaId: string, text: string) {
  const accessToken = Deno.env.get("META_ACCESS_TOKEN") || Deno.env.get("WHATSAPP_ACCESS_TOKEN") || "";
  const phoneNumberId = Deno.env.get("WA_PHONE_NUMBER_ID") || Deno.env.get("WHATSAPP_PHONE_NUMBER_ID") || "";
  const apiVersion = Deno.env.get("WHATSAPP_API_VERSION") || Deno.env.get("META_GRAPH_VERSION") || "";
  if (!accessToken || !phoneNumberId || !apiVersion) {
    throw new Error("Meta reminder delivery is not configured for H voice");
  }
  const endpoint = `https://graph.facebook.com/${encodeURIComponent(apiVersion)}/${encodeURIComponent(phoneNumberId)}/messages`;
  const sendPayload = async (payload: unknown) => {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await response.text();
    return { ok: response.ok, status: response.status, body };
  };

  const freeForm = await sendPayload({
    messaging_product: "whatsapp",
    recipient_type: "individual",
    to: targetWaId,
    type: "text",
    text: { preview_url: false, body: text.slice(0, 4096) },
  });
  if (freeForm.ok) return;

  const paidTemplateAllowed = Deno.env.get("H_ALLOW_PAID_WHATSAPP_TEMPLATE") === "true";
  const templateName = Deno.env.get("WHATSAPP_REMINDER_TEMPLATE_NAME") || "";
  const outsideWindow = /24.?hour|window|template|131047/i.test(freeForm.body);
  if (outsideWindow && paidTemplateAllowed && templateName) {
    const template = await sendPayload({
      messaging_product: "whatsapp",
      to: targetWaId,
      type: "template",
      template: {
        name: templateName,
        language: { code: Deno.env.get("WHATSAPP_REMINDER_TEMPLATE_LANGUAGE") || "ar" },
        components: [{ type: "body", parameters: [{ type: "text", text: text.slice(0, 1024) }] }],
      },
    });
    if (template.ok) return;
    throw new Error(`Meta template reminder failed (${template.status}): ${template.body.slice(0, 300)}`);
  }

  if (outsideWindow && !paidTemplateAllowed) {
    throw new Error("Meta 24-hour window closed; paid/template fallback disabled by H free-service policy");
  }
  throw new Error(`Meta reminder send failed (${freeForm.status}): ${freeForm.body.slice(0, 300)}`);
}

'''
          replace_once(index, send_anchor, meta_sender + send_anchor)

          voice_module = r'''export type VoiceDeliveryContext =
  | { channel: "peach" }
  | { channel: "meta"; targetWaId: string };

export type VoiceTranscriptInput = {
  waId: string;
  messageId: string;
  transcript: string;
  receivedAt: string | null;
};

export function parseVoiceTranscriptPayload(payload: unknown): VoiceTranscriptInput | null {
  if (!payload || typeof payload !== "object" || Array.isArray(payload)) return null;
  const value = payload as Record<string, unknown>;
  if (value.mode !== "voice_transcript") return null;

  const waId = String(value.wa_id || "").replace(/\D/g, "");
  const messageId = String(value.message_id || "").trim();
  const transcript = String(value.transcript || "").trim();
  if (!/^\d{8,20}$/.test(waId)) return null;
  if (!messageId || messageId.length > 200) return null;
  if (!transcript || transcript.length > 12_000) return null;

  let receivedAt: string | null = null;
  if (value.received_at != null && String(value.received_at).trim()) {
    const parsed = new Date(String(value.received_at));
    if (Number.isNaN(parsed.getTime())) return null;
    receivedAt = parsed.toISOString();
  }
  return { waId, messageId, transcript, receivedAt };
}

export function syntheticMetaConversationId(waId: string): number {
  let hash = 0x811c9dc5;
  for (const char of waId) {
    hash ^= char.charCodeAt(0);
    hash = Math.imul(hash, 0x01000193);
  }
  return 1 + ((hash >>> 0) % 2_000_000_000);
}

export function deliveryMetadata(
  delivery: VoiceDeliveryContext,
  source: string,
  originalText: string,
): Record<string, unknown> {
  const base: Record<string, unknown> = {
    source,
    original_text: originalText.slice(0, 2000),
  };
  if (delivery.channel === "meta") {
    base.delivery_channel = "meta";
    base.target_wa_id = delivery.targetWaId.replace(/\D/g, "");
  }
  return base;
}
'''
          Path("cloud/supabase/h-whatsapp-inbox/voice-bridge.ts").write_text(voice_module)

          voice_tests = r'''import {
  deliveryMetadata,
  parseVoiceTranscriptPayload,
  syntheticMetaConversationId,
} from "./voice-bridge.ts";

Deno.test("voice transcript payload accepts Arabic and normalizes wa id", () => {
  const value = parseVoiceTranscriptPayload({
    mode: "voice_transcript",
    wa_id: "+966 55 123 4567",
    message_id: "wamid.voice-1",
    transcript: "  ذكرني بعد ساعة أشرب ماء  ",
    received_at: "2026-09-08T18:00:00Z",
  });
  if (!value) throw new Error("expected valid voice input");
  if (value.waId !== "966551234567") throw new Error(`unexpected wa id ${value.waId}`);
  if (value.transcript !== "ذكرني بعد ساعة أشرب ماء") throw new Error("transcript was not trimmed");
});

Deno.test("voice transcript rejects empty oversized or malformed payloads", () => {
  const invalid = [
    null,
    { mode: "voice_transcript", wa_id: "123", message_id: "x", transcript: "hello" },
    { mode: "voice_transcript", wa_id: "966551234567", message_id: "x", transcript: "" },
    { mode: "voice_transcript", wa_id: "966551234567", message_id: "x", transcript: "x".repeat(12001) },
    { mode: "voice_transcript", wa_id: "966551234567", message_id: "x", transcript: "hi", received_at: "bad-date" },
  ];
  for (const value of invalid) {
    if (parseVoiceTranscriptPayload(value) !== null) throw new Error("invalid payload was accepted");
  }
});

Deno.test("meta conversation id is stable positive and owner specific", () => {
  const first = syntheticMetaConversationId("966551234567");
  const again = syntheticMetaConversationId("966551234567");
  const other = syntheticMetaConversationId("966551234568");
  if (first !== again || first <= 0) throw new Error("conversation id is not stable and positive");
  if (first === other) throw new Error("different users unexpectedly collided in test fixture");
});

Deno.test("delivery metadata records meta channel without credentials", () => {
  const metadata = deliveryMetadata(
    { channel: "meta", targetWaId: "+966 55 123 4567" },
    "whatsapp_voice_meta",
    "احفظ هذه الفكرة",
  );
  if (metadata.delivery_channel !== "meta") throw new Error("missing delivery channel");
  if (metadata.target_wa_id !== "966551234567") throw new Error("target was not normalized");
  if (Object.keys(metadata).some((key) => /secret|token|key/i.test(key))) throw new Error("credential-like metadata key found");
});
