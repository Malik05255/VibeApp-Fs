name: H WhatsApp Voice One-Shot Patch

on:
  push:
    branches: ["feature/h-whatsapp-voice"]
    paths:
      - ".github/workflows/h-whatsapp-voice-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/h-whatsapp-voice
          fetch-depth: 0

      - name: Patch unified H voice path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          index = "cloud/supabase/h-whatsapp-inbox/index.ts"

