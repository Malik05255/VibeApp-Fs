          'import { completeFreeOpenRouterChat, getOpenRouterAiStatus } from "./openrouter-ai.ts";\nimport {\n  deliveryMetadata,\n  parseVoiceTranscriptPayload,\n  syntheticMetaConversationId,\n  type VoiceDeliveryContext,\n} from "./voice-bridge.ts";\n')

