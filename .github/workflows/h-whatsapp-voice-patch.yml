name: H WhatsApp Voice One-Shot Patch

on:
  push:
    branches: ["feature/h-whatsapp-voice"]
    paths:
      - ".github/workflows/h-whatsapp-voice-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/h-whatsapp-voice
          fetch-depth: 0

      - name: Patch unified H voice path
        run: python3 .github/scripts/h_whatsapp_voice_patch.py

      - name: Validate patched source locally
        run: |
          node --check cloud/whatsapp-worker/src/index.js
          grep -q 'processVoiceTranscript' cloud/supabase/h-whatsapp-inbox/index.ts
          grep -q 'voiceBridgeConfigured' cloud/whatsapp-worker/src/index.js

      - name: Commit source patch
        run: |
          git config user.name "Malik05255"
          git config user.email "mmbbrr99@gmail.com"
          git add cloud/whatsapp-worker/src/index.js cloud/supabase/h-whatsapp-inbox/index.ts cloud/supabase/h-whatsapp-inbox/voice-bridge.ts cloud/supabase/h-whatsapp-inbox/voice-bridge_test.ts docs/H_WHATSAPP_VOICE.md
          git commit -m "feat(h): bridge WhatsApp voice into unified cloud runtime"
          git push origin HEAD:feature/h-whatsapp-voice
