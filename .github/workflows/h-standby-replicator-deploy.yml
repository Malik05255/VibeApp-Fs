name: Deploy H Standby Replicator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-replicator/**"
      - ".github/workflows/h-standby-replicator-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-standby-replicator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Require deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing+=("SUPABASE_ACCESS_TOKEN")
          [ -n "${SUPABASE_PROJECT_REF:-}" ] || missing+=("SUPABASE_PROJECT_REF")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Standby replicator was NOT deployed. Missing GitHub secret(s): %s\n' "$(IFS=,; echo "${missing[*]}")"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy primary-side replicator only
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/supabase/h-standby-replicator/index.ts
          supabase functions deploy h-standby-replicator \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify deployed inventory
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          grep -Fq "h-standby-replicator" <<< "$inventory" || {
            echo "::error::Supabase CLI returned success but h-standby-replicator is absent from deployed inventory."
            exit 1
          }

      - name: Confirm standby SQL was not applied by this workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/standby/supabase/migrations/20260910_h_standby_replica_protocol.sql
          echo "Standby target SQL is repository-only and is not applied to the primary by this workflow."
