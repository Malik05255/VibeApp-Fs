name: Deploy H Standby Replicator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-replicator/**"
      - ".github/workflows/h-standby-replicator-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-standby-replicator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Check deployment configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Standby replicator deployment skipped because Supabase deployment secrets are missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.preflight.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy primary-side replicator only
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/supabase/h-standby-replicator/index.ts
          supabase functions deploy h-standby-replicator \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Verify deployed inventory
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          grep -Fq "h-standby-replicator" <<< "$inventory"

      - name: Confirm standby SQL was not applied by this workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/standby/supabase/migrations/20260910_h_standby_replica_protocol.sql
          echo "Standby target SQL is repository-only and is not applied to the primary by this workflow."
