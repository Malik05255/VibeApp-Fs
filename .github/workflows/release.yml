name: Signed lm_AI Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      LM_AI_KEYSTORE_BASE64: ${{ secrets.LM_AI_KEYSTORE_BASE64 }}
      ORG_GRADLE_PROJECT_LM_AI_STORE_FILE: ${{ github.workspace }}/.signing/lm-ai-release.jks
      ORG_GRADLE_PROJECT_LM_AI_STORE_PASSWORD: ${{ secrets.LM_AI_STORE_PASSWORD }}
      ORG_GRADLE_PROJECT_LM_AI_KEY_ALIAS: ${{ secrets.LM_AI_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_LM_AI_KEY_PASSWORD: ${{ secrets.LM_AI_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "$LM_AI_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_LM_AI_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_LM_AI_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_LM_AI_KEY_PASSWORD"

      - name: Restore signing keystore
        shell: bash
        run: |
          mkdir -p .signing
          printf %s "$LM_AI_KEYSTORE_BASE64" | base64 --decode > .signing/lm-ai-release.jks

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lm_AI-${{ github.ref_name }}-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
