name: H Production Certification

on:
  workflow_dispatch:
    inputs:
      require_certified:
        description: Fail unless H is fully production certified now
        required: true
        default: false
        type: boolean
      max_age_days:
        description: Maximum accepted age of live evidence
        required: true
        default: "14"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      H_CODE_READINESS_INPUT: h-code-readiness.json
      H_EXTERNAL_DOCTOR_INPUT: h-external-readiness-doctor.json
      H_LIVE_LEDGER_INPUT: h-live-readiness-ledger.json
      H_PRODUCTION_CERTIFICATION_OUTPUT: h-production-certification.json
      H_EXTERNAL_DOCTOR_OUTPUT: h-external-readiness-doctor.json
      H_LIVE_LEDGER_OUTPUT: h-live-readiness-ledger.json
      H_BACKUP_SUPABASE_URL: ${{ secrets.H_BACKUP_SUPABASE_URL }}
      H_BACKUP_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.H_BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
      H_PRIMARY_SUPABASE_URL: ${{ secrets.H_PRIMARY_SUPABASE_URL }}
      H_PRIMARY_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.H_PRIMARY_SUPABASE_SERVICE_ROLE_KEY }}
      H_BACKUP_RUNNER_URL: ${{ secrets.H_BACKUP_RUNNER_URL }}
      H_RUNTIME_SECRET: ${{ secrets.H_RUNTIME_SECRET }}
      H_STANDBY_HEALTH_URL: ${{ secrets.H_STANDBY_HEALTH_URL }}
      H_PRIMARY_HEALTH_URL: ${{ secrets.H_PRIMARY_HEALTH_URL }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
      H_SUPABASE_VOICE_URL: ${{ secrets.H_SUPABASE_VOICE_URL }}
      TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test certification policy
        run: node --test cloud/live-readiness/h-production-certification_test.mjs

      - name: Run reusable H code readiness gates
        shell: bash
        run: |
          set +e
          bash .github/scripts/h-production-readiness-check.sh
          gate_status=$?
          set -e
          sha="$(git rev-parse HEAD)"
          if [[ "$gate_status" -eq 0 ]]; then
            jq -n --arg sha "$sha" '{schemaVersion:1,status:"CODE_READY",codeReady:true,tenGatesPassed:true,gitSha:$sha,secretsIncluded:false}' > h-code-readiness.json
          else
            jq -n --arg sha "$sha" --argjson exitCode "$gate_status" '{schemaVersion:1,status:"CODE_BLOCKED",codeReady:false,tenGatesPassed:false,gitSha:$sha,exitCode:$exitCode,secretsIncluded:false}' > h-code-readiness.json
          fi

      - name: Diagnose external configuration safely
        run: node cloud/live-readiness/h-external-readiness-doctor.mjs

      - name: Collect newest live evidence
        shell: bash
        run: |
          mkdir -p h-live-evidence
          if ! bash .github/scripts/h-collect-live-evidence.sh; then
            echo "Live evidence collection failed; certification will remain fail-closed."
          fi

      - name: Evaluate fresh live evidence ledger
        shell: bash
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          set -euo pipefail
          max_age="${MAX_AGE_DAYS:-14}"
          node cloud/live-readiness/h-live-readiness-ledger.mjs h-live-evidence "--max-age-days=${max_age}"

      - name: Evaluate final H production certification
        shell: bash
        env:
          REQUIRE_CERTIFIED: ${{ inputs.require_certified }}
        run: |
          set -euo pipefail
          args=()
          if [[ "${REQUIRE_CERTIFIED:-false}" == "true" ]]; then
            args+=(--require-certified)
          fi
          node cloud/live-readiness/h-production-certification.mjs "${args[@]}"

      - name: Publish certification summary
        if: always()
        shell: bash
        run: |
          {
            echo '## H production certification'
            echo
            echo 'This is the authoritative combined result for H code readiness, external configuration, and fresh live evidence.'
            echo
            for file in h-production-certification.json h-code-readiness.json h-external-readiness-doctor.json h-live-readiness-ledger.json; do
              if [[ -f "$file" ]]; then
                echo "### ${file}"
                echo '```json'
                cat "$file"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized certification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-production-certification-${{ github.run_id }}
          path: |
            h-production-certification.json
            h-code-readiness.json
            h-external-readiness-doctor.json
            h-live-readiness-ledger.json
          if-no-files-found: warn
          retention-days: 30
