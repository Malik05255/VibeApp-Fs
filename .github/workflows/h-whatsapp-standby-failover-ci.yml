name: H WhatsApp Standby Failover CI

on:
  pull_request:
    paths:
      - "cloud/whatsapp-worker/src/router.js"
      - "cloud/whatsapp-worker/src/router_test.mjs"
      - "cloud/supabase/h-standby-promote/**"
      - "cloud/supabase/h-standby-replicator/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/20260910_h_standby_execution_contract.sql"
      - ".github/workflows/whatsapp-worker-deploy.yml"
      - ".github/workflows/h-whatsapp-standby-failover-ci.yml"
  push:
    branches: [main]
    paths:
      - "cloud/whatsapp-worker/src/router.js"
      - "cloud/whatsapp-worker/src/router_test.mjs"
      - "cloud/supabase/h-standby-promote/**"
      - "cloud/supabase/h-standby-replicator/**"
      - "cloud/standby/supabase/h-standby-health/**"
      - "cloud/standby/supabase/migrations/20260910_h_standby_execution_contract.sql"
      - ".github/workflows/whatsapp-worker-deploy.yml"
      - ".github/workflows/h-whatsapp-standby-failover-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test WhatsApp runtime routing
        run: node --test cloud/whatsapp-worker/src/router_test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check standby promotion runtime
        run: >-
          deno check
          cloud/supabase/h-standby-promote/index.ts
          cloud/supabase/h-standby-replicator/index.ts
          cloud/standby/supabase/h-standby-health/index.ts
      - name: Test strict standby health policy
        run: deno test cloud/standby/supabase/h-standby-health/standby-health-policy_test.ts
      - name: Assert promotion precedes standby execution and no automatic failback exists
        shell: bash
        run: |
          set -euo pipefail
          router=cloud/whatsapp-worker/src/router.js
          health=cloud/standby/supabase/h-standby-health/index.ts
          policy=cloud/standby/supabase/h-standby-health/standby-health-policy.ts
          promotion=cloud/supabase/h-standby-promote/index.ts
          sql=cloud/standby/supabase/migrations/20260910_h_standby_execution_contract.sql
          grep -Fq 'selectUnifiedRuntime' "$router"
          grep -Fq 'promoteStandbyRequestOnly' "$router"
          grep -Fq 'h-standby-promote' "$router"
          grep -Fq 'standbyStatus.activeReady' "$router"
          grep -Fq 'standbyStatus.preflightReady' "$router"
          grep -Fq 'Once this POST' "$router"
          grep -Fq 'standbyAutoFailbackEnabled: false' "$router"
          grep -Fq 'activeReady' "$health"
          grep -Fq 'preflightReady' "$health"
          grep -Fq 'STANDBY_PROMOTION_PROTOCOL' "$policy"
          grep -Fq 'replicaWritesEnabled' "$policy"
          grep -Fq 'h_promote_standby_request_only_v1' "$promotion"
          grep -Fq 'h_prepare_standby_promotion_v1' "$sql"
          grep -Fq 'h_promote_standby_request_only_v1' "$sql"
          grep -Fq "'allow_replica_writes', false" "$sql"
          grep -Fq "'scheduler_active', false" "$sql"
          grep -Fq "'autonomous_outbound_active', false" "$sql"

      - name: Assert Worker deployment cannot leave stale standby failover enabled
        shell: bash
        run: |
          set -euo pipefail
          deploy=.github/workflows/whatsapp-worker-deploy.yml
          grep -Fq 'H_STANDBY_SUPABASE_VOICE_URL: ${{ secrets.H_STANDBY_SUPABASE_VOICE_URL }}' "$deploy"
          grep -Fq 'H_STANDBY_RUNTIME_SECRET: ${{ secrets.H_STANDBY_RUNTIME_SECRET }}' "$deploy"
          grep -Fq "printf '%s' 'true' | wrangler secret put H_STANDBY_FAILOVER_ENABLED" "$deploy"
          grep -Fq "printf '%s' 'false' | wrangler secret put H_STANDBY_FAILOVER_ENABLED" "$deploy"
          grep -Fq 'steps.preflight.outputs.standby_ready' "$deploy"
