name: H Live Readiness Ledger

on:
  workflow_run:
    workflows: ["H Live External Evidence"]
    types: [completed]
  workflow_dispatch:
    inputs:
      require_ready:
        description: Fail unless every fresh external-live gate is proven
        required: true
        default: false
        type: boolean
      max_age_days:
        description: Maximum age of accepted live evidence
        required: true
        default: "14"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      H_LIVE_LEDGER_OUTPUT: h-live-readiness-ledger.json
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test ledger policy
        run: node --test cloud/live-readiness/h-live-readiness-ledger_test.mjs

      - name: Collect newest evidence artifact for each external gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p h-live-evidence .ledger-downloads
          gh api --paginate --slurp "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" > .ledger-downloads/pages.json

          for target in backup standby-preflight failover-active whatsapp-voice; do
            prefix="h-live-evidence-${target}-"
            artifact_id="$(jq -r --arg prefix "$prefix" '
              [.[].artifacts[] | select(.expired == false and (.name | startswith($prefix)))]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' .ledger-downloads/pages.json)"

            if [[ -z "$artifact_id" ]]; then
              echo "No non-expired artifact found for ${target}."
              continue
            fi

            zip_path=".ledger-downloads/${target}.zip"
            out_dir=".ledger-downloads/${target}"
            mkdir -p "$out_dir"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$zip_path"
            unzip -q "$zip_path" -d "$out_dir"

            if [[ -f "$out_dir/h-live-evidence.json" ]]; then
              cp "$out_dir/h-live-evidence.json" "h-live-evidence/${target}.json"
            else
              echo "Newest artifact for ${target} has no h-live-evidence.json; creating fail-closed evidence."
              printf '{"schemaVersion":2,"ok":false,"target":"%s","completedAt":"%s","error":"artifact_missing_evidence_document"}\n' \
                "$target" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "h-live-evidence/${target}.json"
            fi
          done

      - name: Evaluate live readiness
        shell: bash
        env:
          MANUAL_REQUIRE_READY: ${{ inputs.require_ready }}
          MANUAL_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: |
          set -euo pipefail
          max_age="${MANUAL_MAX_AGE_DAYS:-14}"
          args=(h-live-evidence "--max-age-days=${max_age}")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${MANUAL_REQUIRE_READY:-false}" == "true" ]]; then
            args+=(--require-ready)
          fi
          node cloud/live-readiness/h-live-readiness-ledger.mjs "${args[@]}"

      - name: Publish ledger summary
        if: always()
        shell: bash
        run: |
          if [[ -f h-live-readiness-ledger.json ]]; then
            {
              echo '## H live readiness ledger'
              echo
              echo '```json'
              cat h-live-readiness-ledger.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Ledger document was not generated.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload readiness ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h-live-readiness-ledger-${{ github.run_id }}
          path: h-live-readiness-ledger.json
          if-no-files-found: error
          retention-days: 30
