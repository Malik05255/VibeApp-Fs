name: LMAI Separation Orchestrator

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate-and-verify:
    if: github.head_ref == 'lmai-full-separation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Complete runtime/source identity migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          ROOTS = ("app/", "build-engine/", "shadow-runtime/")
          BINARY = {".png",".jpg",".jpeg",".webp",".gif",".ico",".jar",".aar",".so",".ttf",".otf",".zip",".gz",".pdf",".pk8"}
          RENAMES = {
              "VibeProjectDirs": "LmaiProjectDirs",
              "CleanVibeTheme": "CleanLmaiTheme",
              "VibeApp": "LmaiApp",
          }

          def files():
              raw = subprocess.check_output(["git","ls-files","-z"])
              return [x.decode() for x in raw.split(b"\0") if x]

          # Move every source/test path using the old com/vibe hierarchy and known old class names.
          moves=[]
          for old in files():
              if not old.startswith(ROOTS):
                  continue
              new=old.replace("com/vibe/", "com/malik/lmai/")
              for a,b in RENAMES.items():
                  new=new.replace(a,b)
              if new != old:
                  moves.append((old,new))
          for old,new in sorted(moves,key=lambda p:len(p[0]), reverse=True):
              Path(new).parent.mkdir(parents=True,exist_ok=True)
              subprocess.check_call(["git","mv",old,new])

          # Rewrite textual runtime/source identifiers only; third-party package identities are preserved.
          for name in files():
              if not name.startswith(ROOTS):
                  continue
              p=Path(name)
              if p.suffix.lower() in BINARY:
                  continue
              try:
                  raw=p.read_bytes()
              except OSError:
                  continue
              if b"\0" in raw:
                  continue
              try:
                  text=raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              out=text.replace("com.vibe.", "com.malik.lmai.").replace("com/vibe/", "com/malik/lmai/")
              for a,b in RENAMES.items():
                  out=out.replace(a,b)
              if out != text:
                  p.write_text(out,encoding="utf-8")
          PY

      - name: Assert full operational separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'namespace = "com.malik.lmai"' app/build.gradle.kts
          grep -q 'applicationId = "com.malik05255.lmai"' app/build.gradle.kts
          grep -q 'namespace = "com.malik.lmai.build.engine"' build-engine/build.gradle.kts
          grep -q 'android:label="LM_AI"' app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="lmai"' app/src/main/AndroidManifest.xml

          if git grep -n -I -E 'com\.vibe\.|com/vibe/' -- app build-engine shadow-runtime; then
            echo '::error::Old com.vibe operational package remains.'
            exit 1
          fi
          if git ls-files app build-engine shadow-runtime | grep -E 'com/vibe/|VibeProjectDirs|CleanVibeTheme|VibeApp'; then
            echo '::error::Old Vibe runtime/source path remains.'
            exit 1
          fi
          if git grep -n -I -E 'VibeProjectDirs|CleanVibeTheme|\bVibeApp\b' -- app build-engine shadow-runtime; then
            echo '::error::Old Vibe runtime/source identifier remains.'
            exit 1
          fi

      - name: Verify stable install identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'applicationId = \"com.malik05255.lmai\"' app/build.gradle.kts)" -eq 1

      - name: Rebuild embedded runtime, unit tests, and APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :shadow-runtime:bundleLibCompileToJarRelease :build-engine:copyShadowRuntime :app:testDebugUnitTest :app:assembleDebug

      - name: Re-assert after generated runtime rebuild
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E 'com\.vibe\.|com/vibe/' -- app build-engine shadow-runtime; then
            echo '::error::Old package returned after rebuild.'
            exit 1
          fi

      - name: Commit verified separation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app build-engine shadow-runtime LMAI_IDENTITY.md
          if git diff --cached --quiet; then
            echo 'No remaining separation changes required.'
            exit 0
          fi
          git commit -m 'refactor: remove remaining Vibe runtime identities'
          git push origin HEAD:${{ github.head_ref }}
