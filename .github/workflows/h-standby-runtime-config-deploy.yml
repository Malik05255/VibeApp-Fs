name: Deploy H Standby Runtime Config

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/supabase/h-standby-runtime-config/**"
      - ".github/workflows/h-standby-runtime-config-deploy.yml"

permissions:
  contents: read

concurrency:
  group: h-standby-runtime-config-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5

      - name: Check Supabase deployment configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Supabase deployment secrets are not configured; runtime-config deployment was not attempted."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy h-standby-runtime-config with local dependencies
        id: deploy
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/supabase/h-standby-runtime-config/index.ts
          test -f cloud/supabase/h-standby-runtime-config/function-inventory.ts
          supabase functions deploy h-standby-runtime-config \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt
          echo "completed=true" >> "$GITHUB_OUTPUT"

      - name: Verify deployed runtime-config inventory entry
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF")"
          if ! grep -Fq 'h-standby-runtime-config' <<< "$inventory"; then
            echo "h-standby-runtime-config is missing after deployment." >&2
            exit 1
          fi

      - name: Probe fail-closed setup boundary
        if: steps.deploy.outputs.completed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/h-standby-runtime-config/connect")"
          if [ "$status" != "400" ]; then
            echo "Expected setup endpoint to fail closed with HTTP 400 without setup token; got $status" >&2
            cat "$response_file" >&2
            exit 1
          fi
          if ! grep -Fq 'الرابط ناقص' "$response_file"; then
            echo "Runtime-config setup boundary did not return the expected fail-closed response." >&2
            cat "$response_file" >&2
            exit 1
          fi
